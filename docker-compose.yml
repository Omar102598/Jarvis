version: "3.9"

# ==============================================================================
# JARVIS — Docker Compose
# ==============================================================================
# CPU (any laptop/desktop):  docker compose up -d
# With NVIDIA GPU:           docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
# Logs:                      docker compose logs -f <service>
# Stop:                      docker compose down
# ==============================================================================

services:

  # --- Infrastructure ---

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: jarvis-mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: jarvis-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: always

  chroma:
    image: chromadb/chroma:0.6.3
    container_name: jarvis-chroma
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - ANONYMIZED_TELEMETRY=false
      - ALLOW_RESET=false
    restart: always

  # --- Voice Pipeline ---

  wake_word:
    build: ./services/wake_word
    image: ghcr.io/${JARVIS_IMAGE_OWNER:-omar102598}/jarvis-wake_word:${JARVIS_TAG:-latest}
    container_name: jarvis-wake-word
    devices:
      - /dev/snd:/dev/snd
    privileged: true
    depends_on:
      - mosquitto
    environment:
      - MQTT_HOST=mosquitto
      - ROOM_NAME=${ROOM_NAME:-office}
      - WAKE_THRESHOLD=${WAKE_THRESHOLD:-0.5}
    restart: always

  stt:
    build: ./services/stt
    image: ghcr.io/${JARVIS_IMAGE_OWNER:-omar102598}/jarvis-stt:${JARVIS_TAG:-latest}
    container_name: jarvis-stt
    devices:
      - /dev/snd:/dev/snd
    depends_on:
      - mosquitto
    environment:
      - MQTT_HOST=mosquitto
      - STT_DEVICE=${STT_DEVICE:-auto}
      - STT_MODEL=${STT_MODEL:-}
      - AUDIO_DIR=/data/audio_cache
    volumes:
      - ./models:/models
      - ./data:/data
    restart: always

  speaker_verify:
    build: ./services/speaker_verify
    image: ghcr.io/${JARVIS_IMAGE_OWNER:-omar102598}/jarvis-speaker_verify:${JARVIS_TAG:-latest}
    container_name: jarvis-speaker-verify
    depends_on:
      - mosquitto
      - redis
    environment:
      - MQTT_HOST=mosquitto
      - REDIS_HOST=redis
      - VERIFY_THRESHOLD=${VERIFY_THRESHOLD:-0.25}
      - VERIFY_MODE=${VERIFY_MODE:-log}
      - MODEL_DIR=/models/speaker_model
    volumes:
      - ./models:/models
      - ./data:/data
    restart: always

  llm_agent:
    build: ./services/llm_agent
    image: ghcr.io/${JARVIS_IMAGE_OWNER:-omar102598}/jarvis-llm_agent:${JARVIS_TAG:-latest}
    container_name: jarvis-llm
    depends_on:
      - mosquitto
      - redis
      - chroma
    environment:
      - MQTT_HOST=mosquitto
      - REDIS_HOST=redis
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      # Local model tier (Month 3): set OLLAMA_BASE_URL (e.g.
      # http://host.docker.internal:11434/v1) to route the "local" tier to a
      # local Ollama. LOCAL_LLM_MODEL picks the model. Unset = cloud tiers only.
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - LOCAL_LLM_MODEL=${LOCAL_LLM_MODEL:-llama3.1}
      # Firecrawl brain tool (scrape_page) — clean scrape/extract of JS/anti-bot pages.
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:-}
      - FIRECRAWL_URL=${FIRECRAWL_URL:-https://api.firecrawl.dev}
      # Outbound calls (make_call) — Twilio; unset = tool reports it's not set up.
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_FROM_NUMBER=${TWILIO_FROM_NUMBER:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-claude-haiku-4-5}
      - HA_URL=${HA_URL:-http://homeassistant:8123}
      - HA_TOKEN=${HA_TOKEN:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      # Finance plugin — BankSync remote MCP (services/llm_agent/plugins/finance.py)
      - BANKSYNC_API_KEY=${BANKSYNC_API_KEY}
      - BANKSYNC_MCP_URL=${BANKSYNC_MCP_URL:-https://mcp.banksync.io}
      # Filesystem / shell / code tools
      - JARVIS_WORKSPACE=/data/workspace
      - NOTES_DIR=/data/notes
      - SHELL_ALLOWLIST=${SHELL_ALLOWLIST:-}
      - CODE_EXEC_ENABLED=${CODE_EXEC_ENABLED:-false}
      # Daily model-spend budget — one urgent alert when today's total crosses it
      - DAILY_LLM_BUDGET_USD=${DAILY_LLM_BUDGET_USD:-15}
      # Email (SMTP)
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_DEFAULT_TO=${SMTP_DEFAULT_TO:-}
      # SMS (Twilio)
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_FROM=${TWILIO_FROM:-}
      - SMS_DEFAULT_TO=${SMS_DEFAULT_TO:-}
      # Spotify
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
      - SPOTIFY_REFRESH_TOKEN=${SPOTIFY_REFRESH_TOKEN:-}
      # GitHub
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_DEFAULT_REPO=${GITHUB_DEFAULT_REPO:-}
      # User identity (namespaces memory and conversation history)
      - JARVIS_USER_ID=${JARVIS_USER_ID:-default}
      # Google Maps MCP (config/mcp_servers.yml expands this)
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
      - EXPEDIA_API_KEY=${EXPEDIA_API_KEY:-}
      # Package tracking + Resy MCPs (config/mcp_servers.yml expands these)
      - API_TOKEN_17TRACK=${API_TOKEN_17TRACK:-}
      - RESY_EMAIL=${RESY_EMAIL:-}
      - RESY_PASSWORD=${RESY_PASSWORD:-}
      # Ring live-view tool (start streams via gateway, push public URL)
      - GATEWAY_INTERNAL_URL=${GATEWAY_INTERNAL_URL:-http://mobile_gateway:8080}
      - GATEWAY_PUBLIC_URL=${GATEWAY_PUBLIC_URL:-http://localhost:8080}
      - MOBILE_API_KEY=${MOBILE_API_KEY:-}
    volumes:
      - ./data:/data
      - ./services/llm_agent/plugins:/app/plugins
      # MCP server registry — mcp_loader reads /config/mcp_servers.yml
      - ./config:/config:ro
    restart: always

  tts:
    build: ./services/tts
    image: ghcr.io/${JARVIS_IMAGE_OWNER:-omar102598}/jarvis-tts:${JARVIS_TAG:-latest}
    container_name: jarvis-tts
    depends_on:
      - mosquitto
    devices:
      - /dev/snd:/dev/snd
    environment:
      - MQTT_HOST=mosquitto
      - TTS_ENGINE=${TTS_ENGINE:-piper}
      - PIPER_MODEL=${PIPER_MODEL:-en_GB-alan-medium}
    volumes:
      - ./models:/models
      - ./data:/data
    restart: always

  # --- Vision (Phase 3) ---

  # Face recognition over Ring snapshots (InsightFace) — Sentry's deterministic
  # "is that the resident?" signal. Enroll via scripts/enroll_face_ring.sh.
  # (Profile gate removed 2026-07-13: this is part of the Sentry pipeline now.)
  vision:
    build: ./services/vision
    image: ghcr.io/${JARVIS_IMAGE_OWNER:-omar102598}/jarvis-vision:${JARVIS_TAG:-latest}
    container_name: jarvis-vision
    depends_on:
      - mosquitto
      - redis
    environment:
      - MQTT_HOST=mosquitto
      - REDIS_HOST=redis
      - FACE_SIMILARITY_THRESHOLD=${FACE_SIMILARITY_THRESHOLD:-0.45}
      # Legacy webcam mode: set CAMERAS='{"name":"rtsp://..."}' (needs
      # ultralytics re-added to requirements)
      - CAMERAS=${CAMERAS:-{}}
    volumes:
      - ./models:/models
      - ./data:/data
      # buffalo_l model pack (~300MB) downloads on first start — persist it
      - ./models/insightface:/root/.insightface
    restart: always

  # --- Mobile Gateway (iPhone / Siri Shortcut) ---

  mobile_gateway:
    build: ./services/mobile_gateway
    image: ghcr.io/${JARVIS_IMAGE_OWNER:-omar102598}/jarvis-mobile_gateway:${JARVIS_TAG:-latest}
    container_name: jarvis-mobile-gateway
    depends_on:
      - mosquitto
      - redis
    ports:
      - "${MOBILE_GATEWAY_PORT:-8080}:8080"
    environment:
      - MQTT_HOST=mosquitto
      - REDIS_HOST=redis
      - PIPER_MODEL=${PIPER_MODEL:-en_GB-alan-medium}
      - MOBILE_API_KEY=${MOBILE_API_KEY:-}
      - MOBILE_GATEWAY_PORT=8080
      - MOBILE_LLM_TIMEOUT=${MOBILE_LLM_TIMEOUT:-45}
      # Video-native analysis via Gemini (optional — falls back to
      # frame-sampling + Claude when unset). Free tier: aistudio.google.com
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GEMINI_VIDEO_MODEL=${GEMINI_VIDEO_MODEL:-gemini-3.6-flash}
      # Vertex AI path: billed to the GCP project (ordinary GCP credit),
      # authenticated by the VM's own service account — no key needed.
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-}
      - VERTEX_LOCATION=${VERTEX_LOCATION:-global}
      # App voice — chain: ElevenLabs (if key set) → edge-tts → piper.
      # Same env as tts_mac so one .env line changes Mac + app together.
      - TTS_VOICE=${TTS_VOICE:-en-GB-RyanNeural}
      - TTS_RATE=${TTS_RATE:--5%}
      - TTS_PITCH=${TTS_PITCH:--5Hz}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      # Generic webhook ingress (POST /webhook/{source}) — set a secret to enable
      # external services (IFTTT, GitHub, Stripe, automations) to push to the bus.
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      - ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID:-onwK4e9ZLuTAKqWW03F9}
      - ELEVENLABS_MODEL=${ELEVENLABS_MODEL:-eleven_turbo_v2_5}
      # APNs real push — inert until the Apple Developer .p8 exists (see
      # services/mobile_gateway/apns.py for the full activation checklist)
      - APNS_KEY_PATH=${APNS_KEY_PATH:-}
      - APNS_KEY_ID=${APNS_KEY_ID:-}
      - APNS_TEAM_ID=${APNS_TEAM_ID:-}
      - APNS_TOPIC=${APNS_TOPIC:-}
      - APNS_ENV=${APNS_ENV:-sandbox}
    volumes:
      - ./models:/models
      # Persist the Whisper model — a container recreate otherwise re-downloads
      # 1.6GB from HF Hub, and a stalled download leaves the container "Up" but
      # never opens port 8080 (the model loads before uvicorn starts).
      - ./models/hf:/root/.cache/huggingface
    restart: always

  # --- Phase 0: Background Agents ---

  agent_runner:
    build: ./services/agent_runner
    image: ghcr.io/${JARVIS_IMAGE_OWNER:-omar102598}/jarvis-agent_runner:${JARVIS_TAG:-latest}
    container_name: jarvis-agent-runner
    depends_on:
      - mosquitto
      - redis
    environment:
      - MQTT_HOST=mosquitto
      - REDIS_HOST=redis
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-claude-haiku-4-5}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      # Scout (web_monitor): Firecrawl for URL-watch scrape+schema-extraction.
      # Set FIRECRAWL_API_KEY to use it; unset = local scraper + LLM fallback.
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:-}
      - FIRECRAWL_URL=${FIRECRAWL_URL:-https://api.firecrawl.dev}
      - AGENTS_CONFIG=/config/agents.yml
      # HA calendar access — used by the ClassPass agent for calendar-gap ranking
      - HA_URL=${HA_URL:-http://homeassistant:8123}
      - HA_TOKEN=${HA_TOKEN:-}
      # BankSync — finance widget producer (writes widget:finance:data)
      - BANKSYNC_API_KEY=${BANKSYNC_API_KEY}
      - BANKSYNC_MCP_URL=${BANKSYNC_MCP_URL:-https://mcp.banksync.io}
      # Developer agent (Forge) — file/shell access via mac_bridge on the host
      - MAC_BRIDGE_HOST=${MAC_BRIDGE_HOST:-host.docker.internal}
      - MAC_BRIDGE_PORT=${MAC_BRIDGE_PORT:-7777}
      - DEV_LLM_MODEL=${DEV_LLM_MODEL:-claude-opus-4-8}
      # Forge prefers the Claude Code CLI on the host (Pro-plan billing, not
      # API credits); API tool-loop is the fallback. See developer_agent.py.
      - DEV_PREFER_CLI=${DEV_PREFER_CLI:-true}
      - DEV_CLI_BIN=${DEV_CLI_BIN:-/usr/local/bin/claude}
      - DEV_CLI_TIMEOUT_S=${DEV_CLI_TIMEOUT_S:-900}
      # Email triage agent (Hermes) — IMAP inbox access (Gmail app password)
      - IMAP_HOST=${IMAP_HOST:-imap.gmail.com}
      - IMAP_USER=${IMAP_USER:-}
      - IMAP_PASSWORD=${IMAP_PASSWORD:-}
      # User-local timezone for day math (container clock is UTC)
      - USER_TZ=${USER_TZ:-America/Chicago}
      # Chronicle (daily memory): optional local-model summarization. Set
      # CHRONICLE_LLM_MODEL (+ OPENAI_BASE_URL for a local Ollama) to journal
      # on-device for $0/night; unset uses the normal API model.
      - CHRONICLE_LLM_MODEL=${CHRONICLE_LLM_MODEL:-}
      - CHRONICLE_CATCHUP_MAX=${CHRONICLE_CATCHUP_MAX:-3}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      # Sentry: snapshot links in app pushes + iMessage identity
      - GATEWAY_PUBLIC_URL=${GATEWAY_PUBLIC_URL:-http://localhost:8080}
      - MOBILE_API_KEY=${MOBILE_API_KEY:-}
      - SENTRY_COOLDOWN_S=${SENTRY_COOLDOWN_S:-600}
      # Daily model-spend budget (mirrors llm_agent) + Echo/Vega tuning
      - DAILY_LLM_BUDGET_USD=${DAILY_LLM_BUDGET_USD:-15}
      - HABIT_WINDOW_DAYS=${HABIT_WINDOW_DAYS:-14}
      - QA_TASKS_CONFIG=/config/qa_tasks.yml
      # Native web search (Anthropic server-side tool) — replaces Tavily for
      # Ada/Jeeves/Walter. Needs a search-capable model: the dynamic-filtering
      # variant requires Opus 4.6+ / Sonnet 4.6+ (haiku gets the basic one).
      - SEARCH_LLM_MODEL=${SEARCH_LLM_MODEL:-claude-sonnet-5}
      - SEARCH_MAX_USES=${SEARCH_MAX_USES:-5}
      - RESEARCH_MAX_SEARCHES=${RESEARCH_MAX_SEARCHES:-8}
      # Walter runs daily, so his native-search bill recurs — off by default
      # (~$0.57/digest vs ~$0.01 on Tavily). See newsletter_agent.py.
      - NEWSLETTER_NATIVE_SEARCH=${NEWSLETTER_NATIVE_SEARCH:-false}
    volumes:
      - ./config:/config:ro
    restart: always

  # --- Synapse: event store + notification router + cross-agent correlation ---
  # Always-on bus consumer. Mirrors meaningful traffic into a durable, replayable
  # Redis Stream (jarvis:events), funnels jarvis/notify into immediate pushes or a
  # batched digest, and periodically joins signals across agents into insights.
  # Near-no-op when the house is quiet; no LLM calls on the hot path.
  synapse:
    build: ./services/synapse
    image: ghcr.io/${JARVIS_IMAGE_OWNER:-omar102598}/jarvis-synapse:${JARVIS_TAG:-latest}
    container_name: jarvis-synapse
    depends_on:
      - mosquitto
      - redis
    environment:
      - MQTT_HOST=mosquitto
      - REDIS_HOST=redis
      - SYNAPSE_RULE_INTERVAL_S=${SYNAPSE_RULE_INTERVAL_S:-300}
      - SYNAPSE_RULE_COOLDOWN_S=${SYNAPSE_RULE_COOLDOWN_S:-43200}
      - DIGEST_INTERVAL_S=${DIGEST_INTERVAL_S:-3600}
      - DIGEST_MAX=${DIGEST_MAX:-8}
      - NOTIFY_DEDUP_TTL_S=${NOTIFY_DEDUP_TTL_S:-1800}
    restart: always

  dashboard:
    build: ./services/dashboard
    image: ghcr.io/${JARVIS_IMAGE_OWNER:-omar102598}/jarvis-dashboard:${JARVIS_TAG:-latest}
    container_name: jarvis-dashboard
    depends_on:
      - mosquitto
      - redis
    ports:
      - "${DASHBOARD_PORT:-8888}:8888"
    environment:
      - REDIS_HOST=redis
      - MQTT_HOST=mosquitto
      - DASHBOARD_PORT=8888
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
      - WIDGETS_DIR=/app/widgets
      - JARVIS_USER_ID=${JARVIS_USER_ID:-default}
    volumes:
      - ./services/dashboard/widgets:/app/widgets
      - ./services/dashboard/templates:/app/templates
    restart: always

  # --- Wearable Bridge (Phase 4) ---

  glasses_bridge:
    build: ./services/glasses_bridge
    image: ghcr.io/${JARVIS_IMAGE_OWNER:-omar102598}/jarvis-glasses_bridge:${JARVIS_TAG:-latest}
    container_name: jarvis-glasses
    depends_on:
      - mosquitto
    ports:
      - "8765:8765"  # WebSocket port for phone companion app
    environment:
      - MQTT_HOST=mosquitto
    profiles:
      - wearable  # Only start with: docker compose --profile wearable up -d
    restart: always

  # --- Home Assistant — smart-home hub (PetKit feeders/fountain via HACS,
  # future Matter/HomeKit devices, unlocks smart_home + camera tools) ---
  # One-time setup: onboard at http://localhost:8123 (create local account),
  # then Profile -> Security -> Long-Lived Access Token -> HA_TOKEN in .env.
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: jarvis-homeassistant
    ports:
      - "8123:8123"
    volumes:
      - ./data/homeassistant:/config
      - /etc/localtime:/ro/etc/localtime:ro
    environment:
      - TZ=${USER_TZ:-America/Chicago}
    restart: always

  # --- Ring cameras → MQTT bridge (community project, actively maintained) ---
  # One-time setup: generate the Ring refresh token interactively —
  #   docker run -it --rm --entrypoint /app/ring-mqtt/init-ring-mqtt.js \
  #     -v ./data/ring-mqtt:/data tsightler/ring-mqtt
  # (prompts for Ring email/password/2FA; writes ring-state.json to the volume)
  # Then: docker compose up -d ring_mqtt
  # Publishes ring/<location>/camera/<device>/... (motion, ding, snapshots) to
  # the same mosquitto broker Jarvis already uses. agent_runner subscribes and
  # feeds the Sentry agent + check_ring_camera tool.
  ring_mqtt:
    image: tsightler/ring-mqtt
    container_name: jarvis-ring-mqtt
    depends_on:
      - mosquitto
    ports:
      - "55123:55123"   # token-generation web UI (http://localhost:55123)
    volumes:
      - ./data/ring-mqtt:/data
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    restart: always

volumes:
  mosquitto_data:
  redis_data:
  chroma_data:

# The apartment LAN is 172.20.0.0/16 — Docker's auto-assigned bridge for this
# project COLLIDED with it (also 172.20.0.0/16), so containers routed traffic
# for real LAN devices (Apple TVs, Govee, future Sonos) into the bridge and
# could never reach them. Pin the project network to a subnet that can't clash.
networks:
  default:
    ipam:
      config:
        - subnet: 10.87.0.0/24
