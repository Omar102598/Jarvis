version: "3.9"

# ==============================================================================
# JARVIS — Docker Compose
# ==============================================================================
# CPU (any laptop/desktop):  docker compose up -d
# With NVIDIA GPU:           docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
# Logs:                      docker compose logs -f <service>
# Stop:                      docker compose down
# ==============================================================================

services:

  # --- Infrastructure ---

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: jarvis-mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: jarvis-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: always

  # --- Voice Pipeline ---

  wake_word:
    build: ./services/wake_word
    container_name: jarvis-wake-word
    devices:
      - /dev/snd:/dev/snd
    privileged: true
    depends_on:
      - mosquitto
    environment:
      - MQTT_HOST=mosquitto
      - ROOM_NAME=${ROOM_NAME:-office}
      - WAKE_THRESHOLD=${WAKE_THRESHOLD:-0.5}
    restart: always

  stt:
    build: ./services/stt
    container_name: jarvis-stt
    devices:
      - /dev/snd:/dev/snd
    depends_on:
      - mosquitto
    environment:
      - MQTT_HOST=mosquitto
      - STT_DEVICE=${STT_DEVICE:-auto}
      - STT_MODEL=${STT_MODEL:-}
      - AUDIO_DIR=/data/audio_cache
    volumes:
      - ./models:/models
      - ./data:/data
    restart: always

  speaker_verify:
    build: ./services/speaker_verify
    container_name: jarvis-speaker-verify
    depends_on:
      - mosquitto
      - redis
    environment:
      - MQTT_HOST=mosquitto
      - REDIS_HOST=redis
      - VERIFY_THRESHOLD=${VERIFY_THRESHOLD:-0.25}
      - VERIFY_MODE=${VERIFY_MODE:-log}
      - MODEL_DIR=/models/speaker_model
    volumes:
      - ./models:/models
      - ./data:/data
    restart: always

  llm_agent:
    build: ./services/llm_agent
    container_name: jarvis-llm
    depends_on:
      - mosquitto
      - redis
    environment:
      - MQTT_HOST=mosquitto
      - REDIS_HOST=redis
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-claude-haiku-4-5}
      - HA_URL=${HA_URL}
      - HA_TOKEN=${HA_TOKEN}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      # Filesystem / shell / code tools
      - JARVIS_WORKSPACE=/data/workspace
      - NOTES_DIR=/data/notes
      - SHELL_ALLOWLIST=${SHELL_ALLOWLIST:-}
      - CODE_EXEC_ENABLED=${CODE_EXEC_ENABLED:-false}
      # Email (SMTP)
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_DEFAULT_TO=${SMTP_DEFAULT_TO:-}
      # SMS (Twilio)
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_FROM=${TWILIO_FROM:-}
      - SMS_DEFAULT_TO=${SMS_DEFAULT_TO:-}
      # Spotify
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
      - SPOTIFY_REFRESH_TOKEN=${SPOTIFY_REFRESH_TOKEN:-}
      # GitHub
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_DEFAULT_REPO=${GITHUB_DEFAULT_REPO:-}
    volumes:
      - ./data:/data
    restart: always

  tts:
    build: ./services/tts
    container_name: jarvis-tts
    depends_on:
      - mosquitto
    devices:
      - /dev/snd:/dev/snd
    environment:
      - MQTT_HOST=mosquitto
      - TTS_ENGINE=${TTS_ENGINE:-piper}
      - PIPER_MODEL=${PIPER_MODEL:-en_GB-alan-medium}
    volumes:
      - ./models:/models
      - ./data:/data
    restart: always

  # --- Vision (Phase 3) ---

  vision:
    build: ./services/vision
    container_name: jarvis-vision
    depends_on:
      - mosquitto
      - redis
    environment:
      - MQTT_HOST=mosquitto
      - REDIS_HOST=redis
      - CAMERA_URLS=${CAMERA_URLS:-{}}
      - PROCESS_FPS=${PROCESS_FPS:-5}
      - FACE_THRESHOLD=${FACE_THRESHOLD:-0.4}
    volumes:
      - ./models:/models
      - ./data:/data
    profiles:
      - vision  # Only start with: docker compose --profile vision up -d
    restart: always

  # --- Mobile Gateway (iPhone / Siri Shortcut) ---

  mobile_gateway:
    build: ./services/mobile_gateway
    container_name: jarvis-mobile-gateway
    depends_on:
      - mosquitto
    ports:
      - "${MOBILE_GATEWAY_PORT:-8080}:8080"
    environment:
      - MQTT_HOST=mosquitto
      - PIPER_MODEL=${PIPER_MODEL:-en_GB-alan-medium}
      - MOBILE_API_KEY=${MOBILE_API_KEY:-}
      - MOBILE_GATEWAY_PORT=8080
      - MOBILE_LLM_TIMEOUT=${MOBILE_LLM_TIMEOUT:-45}
    volumes:
      - ./models:/models
    restart: always

  # --- Phase 0: Background Agents ---

  agent_runner:
    build: ./services/agent_runner
    container_name: jarvis-agent-runner
    depends_on:
      - mosquitto
      - redis
    environment:
      - MQTT_HOST=mosquitto
      - REDIS_HOST=redis
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-claude-haiku-4-5}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - AGENTS_CONFIG=/config/agents.yml
    volumes:
      - ./config:/config:ro
    restart: always

  dashboard:
    build: ./services/dashboard
    container_name: jarvis-dashboard
    depends_on:
      - mosquitto
      - redis
    ports:
      - "${DASHBOARD_PORT:-8888}:8888"
    environment:
      - REDIS_HOST=redis
      - MQTT_HOST=mosquitto
      - DASHBOARD_PORT=8888
    restart: always

  # --- Wearable Bridge (Phase 4) ---

  glasses_bridge:
    build: ./services/glasses_bridge
    container_name: jarvis-glasses
    depends_on:
      - mosquitto
    ports:
      - "8765:8765"  # WebSocket port for phone companion app
    environment:
      - MQTT_HOST=mosquitto
    profiles:
      - wearable  # Only start with: docker compose --profile wearable up -d
    restart: always

volumes:
  mosquitto_data:
  redis_data:
