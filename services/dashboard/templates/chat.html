{% extends "base.html" %}
{% block title %}JARVIS — Chat{% endblock %}

{% block extra_css %}
<style>
  /* Full-height chat column: feed scrolls, the composer is pinned to the bottom.
     Mirrors the iOS app's chat tab. */
  .chat-wrap {
    position: fixed;
    inset: 54px 0 0 0;
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    z-index: 1;
  }
  /* Override the shared #conv-feed cap — here the feed owns all the space. */
  .chat-wrap #conv-feed {
    flex: 1 1 auto;
    max-height: none;
    overflow-y: auto;
    padding: 18px 18px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  #chat-status {
    font-size: 0.68rem;
    letter-spacing: 1px;
    color: var(--j-gold);
    padding: 0 20px 6px;
    min-height: 16px;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  #chat-status.on::before {
    content: '';
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--j-gold); box-shadow: 0 0 6px var(--j-gold);
    animation: blink 1s infinite;
  }
  .chat-input-bar {
    display: flex;
    gap: 10px;
    align-items: center;
    padding: 12px 16px calc(14px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--j-border);
    background: rgba(3,8,16,0.92);
  }
  #chat-text {
    flex: 1 1 auto;
    background: #060e1a;
    border: 1px solid var(--j-border);
    border-radius: 11px;
    color: #cdd6e8;
    padding: 12px 15px;
    font-size: 0.9rem;
    font-family: inherit;
    outline: none;
    transition: border-color .15s;
  }
  #chat-text:focus { border-color: rgba(0,212,255,0.45); }
  #chat-text::placeholder { color: #3a5064; }
  .icon-btn {
    flex: 0 0 auto;
    width: 46px; height: 46px;
    border-radius: 50%;
    border: 1px solid rgba(0,136,170,0.5);
    background: transparent;
    color: var(--j-blue);
    font-size: 1.1rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .2s, box-shadow .2s, border-color .2s;
  }
  .icon-btn:hover { background: rgba(0,212,255,0.08); box-shadow: 0 0 8px rgba(0,212,255,0.2); }
  #speak-btn.recording {
    border-color: var(--j-gold);
    color: var(--j-gold);
    background: rgba(240,160,32,0.12);
    box-shadow: 0 0 12px rgba(240,160,32,0.5);
    animation: blink 1.2s infinite;
  }
  #send-btn {
    flex: 0 0 auto;
    background: transparent;
    border: 1px solid rgba(0,136,170,0.5);
    color: var(--j-blue);
    font-size: 0.72rem; letter-spacing: 2px; font-weight: 600;
    padding: 0 18px; height: 46px;
    border-radius: 11px; cursor: pointer;
    transition: background .2s, box-shadow .2s;
  }
  #send-btn:hover    { background: rgba(0,212,255,0.08); box-shadow: 0 0 8px rgba(0,212,255,0.2); }
  #send-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .conv-bubble { max-width: 82%; }
  .conv-bubble.has-cards { width: min(82%, 620px); }

  /* ── Markdown in replies (ChatGPT-style) ── */
  .md { font-size: 0.86rem; line-height: 1.6; color: #a9d3e8; }
  .md > :first-child { margin-top: 0; }
  .md > :last-child  { margin-bottom: 0; }
  .md p { margin: 0 0 0.6em; }
  .md h1, .md h2, .md h3, .md h4 { color: #d6eef8; font-weight: 600; margin: 0.9em 0 0.4em; line-height: 1.3; }
  .md h1 { font-size: 1.12rem; } .md h2 { font-size: 1.02rem; } .md h3, .md h4 { font-size: 0.92rem; }
  .md strong { color: #e2f3fb; }
  .md a { color: var(--j-blue); }
  .md ul, .md ol { margin: 0 0 0.6em; padding-left: 1.3em; }
  .md li { margin: 0.15em 0; }
  .md li > p { margin: 0; }
  .md blockquote { margin: 0 0 0.6em; padding: 2px 12px; border-left: 3px solid #1d4a66; color: #7fa9bf; }
  .md hr { border: 0; border-top: 1px solid #12324a; margin: 0.8em 0; }
  .md code { background: #0b1b2c; border: 1px solid #142f47; border-radius: 4px; padding: 1px 5px; font-size: 0.82em; color: #cfe8f5; }
  .md pre { background: #040b14; border: 1px solid #12324a; border-radius: 8px; padding: 10px 12px; overflow-x: auto; margin: 0 0 0.6em; }
  .md pre code { background: none; border: 0; padding: 0; font-size: 0.8rem; }
  .md table, .card-table { border-collapse: collapse; margin: 0 0 0.6em; font-size: 0.8rem; width: 100%; }
  .md th, .md td, .card-table th, .card-table td { border-bottom: 1px solid #12324a; padding: 5px 9px; text-align: left; }
  .md th, .card-table th { color: #7fb6d0; font-weight: 600; font-size: 0.72rem; letter-spacing: 0.5px; text-transform: uppercase; }
  .bubble-u .md { color: #b6c4d2; }

  /* ── Cards (same types the iOS app renders) ── */
  .jcard { background: #071526; border: 1px solid #143553; border-radius: 10px; padding: 11px 13px; margin: 0 0 9px; }
  .jcard-title { font-size: 0.72rem; letter-spacing: 1.5px; text-transform: uppercase; color: var(--j-blue); font-weight: 600; }
  .jcard-sub { font-size: 0.75rem; color: #6d93a8; margin-top: 2px; }
  .jcard-footer { font-size: 0.72rem; color: #5d8197; margin-top: 8px; }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; margin-top: 9px; }
  .stat { background: #050f1c; border: 1px solid #10304a; border-radius: 8px; padding: 7px 9px; }
  .stat-l { font-size: 0.66rem; color: #5f879d; text-transform: uppercase; letter-spacing: 0.6px; }
  .stat-v { font-size: 1.02rem; color: #e0f2fb; font-weight: 600; }
  .stat-s { font-size: 0.68rem; color: #5f879d; }
  .bar-row { margin-top: 8px; }
  .bar-head { display: flex; justify-content: space-between; font-size: 0.74rem; color: #9cc6da; }
  .bar-track { height: 7px; background: #0b2033; border-radius: 4px; overflow: hidden; margin-top: 3px; }
  .bar-fill { height: 100%; border-radius: 4px; background: var(--j-blue); }
  .cal-big { font-size: 1.5rem; font-weight: 700; color: #e6f5fc; margin-top: 6px; }
  .cal-big span { font-size: 0.8rem; font-weight: 400; color: #6d93a8; }
  .action-status { font-size: 0.68rem; letter-spacing: 1px; padding: 2px 8px; border-radius: 10px; border: 1px solid; }
  .action-status.pending { color: var(--j-gold); border-color: rgba(240,160,32,0.5); }
  .action-status.done { color: #3ddc97; border-color: rgba(61,220,151,0.5); }
  .media-chip { display: inline-block; font-size: 0.72rem; color: #7fa9bf; border: 1px solid #1d4a66; border-radius: 12px; padding: 2px 9px; margin-bottom: 6px; }
</style>
{% endblock %}

{% block content %}
<div class="chat-wrap">
  <div id="conv-feed">
    <div style="font-size:0.82rem;color:#2d4055;text-align:center;margin:auto">No conversation yet…</div>
  </div>
  <div id="chat-status"></div>
  <div class="chat-input-bar">
    <button id="speak-btn" class="icon-btn" title="Hold-to-talk: records, sends, and speaks the reply"
            onclick="toggleSpeak()">🎤</button>
    <input id="chat-text" type="text" autocomplete="off" placeholder="Message JARVIS…"
           onkeydown="if(event.key==='Enter'){event.preventDefault();sendText();}">
    <button id="send-btn" onclick="sendText()">SEND</button>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script>
// ══════════════════════════════════════════════════════════
//  CONVERSATION FEED  (SSE — same stream the old dashboard used)
// ══════════════════════════════════════════════════════════
let _convSig = null;
let _forceScroll = false;

function toolCallsFor(turnId, events) {
  if (!turnId || !events) return [];
  const merged = [];
  for (let i = events.length - 1; i >= 0; i--) {
    const e = events[i];
    if (e.turn_id !== turnId) continue;
    const key = e.call_id || '';
    const at = key ? merged.findIndex(m => m.call_id === key) : -1;
    if (at >= 0) { if (e.status === 'done') merged[at] = e; }
    else merged.push(e);
  }
  return merged;
}

function renderToolCalls(calls) {
  if (!calls.length) return '';
  const rows = calls.map((c, idx) => {
    const isLast = idx === calls.length - 1;
    const cls = c.status === 'done' ? 'done' : c.status === 'calling' ? 'calling' : 'error';
    const ts = c.timestamp
      ? new Date(c.timestamp).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'})
      : '';
    return `<div class="tl-entry">
      <div class="tl-spine"><div class="tl-dot ${cls}"></div>${!isLast ? '<div class="tl-line"></div>' : ''}</div>
      <div class="tl-content" onclick="this.classList.toggle('tc-open')">
        <div class="tl-tool ${cls}">${esc(c.tool || 'tool')}</div>
        <div class="tc-detail">
          ${c.args_preview ? `<div class="tl-args">${esc(c.args_preview)}</div>` : ''}
          ${c.result_preview ? `<div class="tl-result">${esc(c.result_preview)}</div>` : ''}
        </div>
        ${ts ? `<div class="tl-ts">${ts}</div>` : ''}
      </div>
    </div>`;
  }).join('');
  return `<div class="tc-list">${rows}</div>`;
}

// ── Message text → sanitized markdown ──
const CARD_MARKER = /\[\[card:[0-9a-f]{10}\]\](?: \(A card with these numbers[^)]*\))?/g;

function contentText(content) {
  if (typeof content === 'string') return content;
  if (Array.isArray(content)) {
    return content.filter(b => b && b.type === 'text').map(b => b.text || '').join('\n');
  }
  return '';
}

function renderMarkdown(text) {
  if (window.marked && window.DOMPurify) {
    const html = marked.parse(text, { gfm: true, breaks: true });
    return DOMPurify.sanitize(html);
  }
  return esc(text).replace(/\n/g, '<br>');   // CDN unreachable: still readable
}

// ── Cards — same five types as the iOS app (see llm_agent/tools/cards.py) ──
function pct(v, t) { return t > 0 ? Math.max(0, Math.min(100, 100 * v / t)) : 0; }
function num(v) { return (typeof v === 'number') ? (Math.round(v * 10) / 10).toLocaleString() : esc(v); }

function renderChart(c) {
  const pts = (c.points || []).filter(p => typeof p.y === 'number');
  if (!pts.length) return '';
  const W = 520, H = 150, pad = 22;
  const ys = pts.map(p => p.y).concat(typeof c.target === 'number' ? [c.target] : []);
  const hi = Math.max(...ys), lo = Math.min(...ys), span = (hi - lo) || Math.abs(hi) * 0.1 || 1;
  // Bars start at zero; a line zooms to its own range so a 2lb trend isn't flat.
  const max = c.kind === 'line' ? hi + span * 0.15 : hi * 1.1 || 1;
  const min = c.kind === 'line' ? lo - span * 0.15 : 0;
  const sx = i => pad + (pts.length === 1 ? (W - 2 * pad) / 2 : i * (W - 2 * pad) / (pts.length - 1));
  const sy = y => H - pad - (y - min) / ((max - min) || 1) * (H - 2 * pad);
  let body = '';
  if (c.kind === 'line') {
    body = `<polyline fill="none" stroke="#00d4ff" stroke-width="2" points="${pts.map((p, i) => sx(i) + ',' + sy(p.y)).join(' ')}"/>` +
           pts.map((p, i) => `<circle cx="${sx(i)}" cy="${sy(p.y)}" r="3" fill="#00d4ff"><title>${esc(p.x)}: ${num(p.y)}</title></circle>`).join('');
  } else {
    const bw = Math.max(6, (W - 2 * pad) / pts.length * 0.6);
    const bx = i => pad + (i + 0.5) * (W - 2 * pad) / pts.length - bw / 2;
    body = pts.map((p, i) => `<rect x="${bx(i)}" y="${sy(p.y)}" width="${bw}" height="${H - pad - sy(p.y)}" rx="2" fill="#00a8cc"><title>${esc(p.x)}: ${num(p.y)}</title></rect>`).join('');
  }
  const target = typeof c.target === 'number'
    ? `<line x1="${pad}" x2="${W - pad}" y1="${sy(c.target)}" y2="${sy(c.target)}" stroke="#f0a020" stroke-dasharray="4 4"/>` : '';
  const step = Math.ceil(pts.length / 8);
  const labels = pts.map((p, i) => i % step ? '' :
    `<text x="${c.kind === 'line' ? sx(i) : pad + (i + 0.5) * (W - 2 * pad) / pts.length}" y="${H - 6}" fill="#5f879d" font-size="12" text-anchor="middle">${esc(p.x)}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;margin-top:8px">${target}${body}${labels}</svg>`;
}

function renderCard(c) {
  if (!c || !c.type) return '';
  const head = `<div class="jcard-title">${esc(c.title || '')}</div>` +
               (c.subtitle ? `<div class="jcard-sub">${esc(c.subtitle)}</div>` : '');
  const foot = c.footer ? `<div class="jcard-footer">${esc(c.footer)}</div>` : '';
  let inner = '';
  if (c.type === 'stats') {
    inner = `<div class="stat-grid">${(c.items || []).map(it =>
      `<div class="stat"><div class="stat-l">${esc(it.label)}</div><div class="stat-v">${esc(it.value)}</div>` +
      (it.sub ? `<div class="stat-s">${esc(it.sub)}</div>` : '') + `</div>`).join('')}</div>`;
  } else if (c.type === 'macros') {
    const cal = c.calories || {};
    inner = `<div class="cal-big">${num(cal.value)} <span>/ ${num(cal.target)} kcal</span></div>` +
      `<div class="bar-track"><div class="bar-fill" style="width:${pct(cal.value, cal.target)}%"></div></div>` +
      (c.bars || []).map(b => `<div class="bar-row"><div class="bar-head"><span>${esc(b.label)}</span>` +
        `<span>${num(b.value)} / ${num(b.target)}${esc(b.unit || '')}</span></div>` +
        `<div class="bar-track"><div class="bar-fill" style="width:${pct(b.value, b.target)}%;${b.color ? 'background:' + esc(b.color) : ''}"></div></div></div>`).join('') +
      (Array.isArray(c.meals) && c.meals.length
        ? `<table class="card-table" style="margin-top:9px">${c.meals.map(m => typeof m === 'string'
            ? `<tr><td>${esc(m)}</td></tr>`
            : `<tr><td>${esc(m.name || m.label || '')}</td><td>${esc(m.calories ?? m.kcal ?? '')}</td></tr>`).join('')}</table>` : '');
  } else if (c.type === 'table') {
    inner = `<table class="card-table" style="margin-top:8px"><thead><tr>${(c.columns || []).map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead>` +
      `<tbody>${(c.rows || []).map(r => `<tr>${r.map(v => `<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  } else if (c.type === 'chart') {
    inner = renderChart(c);
  } else if (c.type === 'action') {
    const st = c.status === 'done' ? 'done' : 'pending';
    return `<div class="jcard" style="display:flex;justify-content:space-between;align-items:center;gap:10px">` +
      `<div>${head}${foot}</div><span class="action-status ${st}">${st === 'done' ? 'DONE' : 'PENDING'}</span></div>`;
  }
  return `<div class="jcard">${head}${inner}${foot}</div>`;
}

function renderBody(m) {
  let text = contentText(m.content).replace(CARD_MARKER, '').trim();
  let chip = '';
  if (m.role !== 'assistant' && text.includes('[camera image]')) {
    const n = text.split('[camera image]').length - 1;
    text = text.replaceAll('[camera image]', '').trim();
    chip = `<div class="media-chip">${n > 1 ? '🎞 video' : '📷 photo'}</div>`;
  }
  const cards = (m.cards || []).map(renderCard).join('');
  return chip + cards + (text ? `<div class="md">${renderMarkdown(text)}</div>` : '');
}

function renderConversation(msgs, toolEvents) {
  const te = toolEvents || [];
  const sig = msgs.length + '|' + (msgs.length ? (msgs[msgs.length-1].role + ':' +
              contentText(msgs[msgs.length-1].content).slice(0, 200)) : '') +
              '|' + te.length + '|' + (te.length ? (te[0].status + te[0].call_id) : '');
  if (sig === _convSig) return;
  _convSig = sig;

  const feed = document.getElementById('conv-feed');
  if (msgs.length === 0) {
    feed.innerHTML = '<div style="font-size:0.82rem;color:#2d4055;text-align:center;margin:auto">No conversation yet…</div>';
    return;
  }
  const atBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 120;
  feed.innerHTML = msgs.map(m => {
    const isJ = m.role === 'assistant';
    const calls = isJ ? toolCallsFor(m.turn_id, te) : [];
    return `<div class="conv-row ${isJ ? '' : 'user'}">
      <div class="conv-avatar ${isJ ? 'avatar-j' : 'avatar-u'}">${isJ ? 'AI' : 'YOU'}</div>
      <div class="conv-bubble ${isJ ? 'bubble-j' : 'bubble-u'}${(m.cards || []).length ? ' has-cards' : ''}">${renderToolCalls(calls)}${renderBody(m)}</div>
    </div>`;
  }).join('');
  // A fresh assistant reply means the turn finished — drop the pending pill.
  if (msgs[msgs.length - 1].role === 'assistant') setPending(false);
  if (atBottom || _forceScroll) { feed.scrollTop = feed.scrollHeight; _forceScroll = false; }
}

function connectSSE() {
  const es = new EventSource('/api/stream');
  es.onmessage = (e) => {
    try { const d = JSON.parse(e.data); if (d.messages) renderConversation(d.messages, d.tool_events); }
    catch (err) { console.warn('SSE parse error', err); }
  };
  es.onerror = () => { es.close(); setTimeout(connectSSE, 5000); };
}

// ══════════════════════════════════════════════════════════
//  COMPOSER  (text → /api/ask, speak:false · never speaks)
// ══════════════════════════════════════════════════════════
function setPending(on, text) {
  const el = document.getElementById('chat-status');
  el.classList.toggle('on', !!on);
  el.textContent = on ? (text || 'Jarvis is thinking…') : '';
}
function setSending(on) {
  document.getElementById('send-btn').disabled = on;
  document.getElementById('chat-text').disabled = on;
}

async function sendText() {
  const input = document.getElementById('chat-text');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  _forceScroll = true;
  setSending(true);
  setPending(true, 'Jarvis is thinking…');
  try {
    // speak:false is set server-side — a typed message gets a typed reply, so
    // nothing is synthesised and the browser plays no audio.
    const r = await fetch('/api/ask', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
    });
    if (!r.ok) { showToast('Send failed (' + r.status + ')'); }
    // The reply (and your message) land in the feed via SSE from Redis.
  } catch (e) {
    showToast('Send failed: ' + e);
  } finally {
    setPending(false);
    setSending(false);
    input.focus();
  }
}

// ══════════════════════════════════════════════════════════
//  CLICK-TO-SPEAK  (audio → /api/ask/audio · SPEAKS the reply)
// ══════════════════════════════════════════════════════════
let mediaStream = null, mediaRecorder = null, chunks = [], recording = false;

function updateSpeakBtn() {
  const btn = document.getElementById('speak-btn');
  btn.classList.toggle('recording', recording);
  btn.textContent = recording ? '⏹' : '🎤';
  btn.title = recording ? 'Stop and send' : 'Click to speak — records, sends, and speaks the reply';
}

async function toggleSpeak() {
  if (recording) { stopRecording(); return; }
  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    showToast('Microphone unavailable: ' + e.name);
    return;
  }
  chunks = [];
  mediaRecorder = new MediaRecorder(mediaStream);
  mediaRecorder.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
  mediaRecorder.onstop = onRecordingStop;
  mediaRecorder.start();
  recording = true;
  updateSpeakBtn();
}

function stopRecording() {
  if (mediaRecorder && recording) {
    recording = false;
    updateSpeakBtn();
    mediaRecorder.stop();
  }
}

async function onRecordingStop() {
  if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
  const blob = new Blob(chunks, { type: (mediaRecorder && mediaRecorder.mimeType) || 'audio/webm' });
  if (!blob.size) return;
  _forceScroll = true;
  setPending(true, 'Transcribing…');
  let body;
  try { body = await blobToWav(blob); }   // WAV is the format the gateway expects
  catch (e) { body = blob; }              // fallback: let faster-whisper sniff it
  try {
    const r = await fetch('/api/ask/audio', {
      method: 'POST', headers: { 'Content-Type': 'application/octet-stream' }, body,
    });
    if (!r.ok) { showToast('Voice failed (' + r.status + ')'); setPending(false); return; }
    const d = await r.json();
    setPending(false);
    if (d.audio_b64) playReply(d.audio_b64);   // click-to-speak speaks
  } catch (e) {
    showToast('Voice failed: ' + e);
    setPending(false);
  }
}

function playReply(b64) {
  try { new Audio('data:audio/wav;base64,' + b64).play(); } catch (e) {}
}

// Decode whatever MediaRecorder produced (webm/opus, mp4…) and re-encode a
// 16-bit mono WAV, so the gateway's STT gets the format it writes to disk.
async function blobToWav(blob) {
  const ab = await blob.arrayBuffer();
  const AC = window.AudioContext || window.webkitAudioContext;
  const ctx = new AC();
  const decoded = await ctx.decodeAudioData(ab);
  if (ctx.close) ctx.close();
  const sr = decoded.sampleRate;
  const ch0 = decoded.getChannelData(0);
  const len = ch0.length;
  const dv = new DataView(new ArrayBuffer(44 + len * 2));
  let o = 0;
  const ws  = (s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o++, s.charCodeAt(i)); };
  const w16 = (v) => { dv.setUint16(o, v, true); o += 2; };
  const w32 = (v) => { dv.setUint32(o, v, true); o += 4; };
  ws('RIFF'); w32(36 + len * 2); ws('WAVE'); ws('fmt '); w32(16); w16(1); w16(1);
  w32(sr); w32(sr * 2); w16(2); w16(16); ws('data'); w32(len * 2);
  for (let i = 0; i < len; i++) {
    const s = Math.max(-1, Math.min(1, ch0[i]));
    dv.setInt16(o, s < 0 ? s * 0x8000 : s * 0x7fff, true); o += 2;
  }
  return new Blob([dv], { type: 'audio/wav' });
}
