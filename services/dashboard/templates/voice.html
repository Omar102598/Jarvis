{% extends "base.html" %}
{% block title %}JARVIS — Voice{% endblock %}

{% block extra_css %}
<style>
  /* The orb owns the whole viewport below the nav. Sized off the smaller of
     width/height so it stays a circle and fills the room-glanceable space. */
  .voice-stage {
    position: fixed;
    inset: 54px 0 0 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
  }
  .voice-stage .orb-scene {
    width:  min(88vw, 88vh);
    height: min(88vw, 88vh);
    flex-shrink: 1;
  }
  /* Core text scales with the orb so "READY / LISTENING / THINKING…" is legible
     from across a room. */
  .voice-stage .orb-core {
    width: 34%;
    height: 34%;
  }
  .voice-stage .orb-label  { font-size: clamp(0.55rem, 1.6vmin, 1.1rem); letter-spacing: clamp(3px, 1vmin, 9px); margin-bottom: 8px; }
  .voice-stage .orb-status { font-size: clamp(1rem, 3.6vmin, 2.6rem);   letter-spacing: clamp(4px, 1vmin, 9px); white-space: nowrap; }
  /* Halos are decorative pulse rings — make them scale with the big orb instead
     of staying their original fixed 200–280px (which looked tiny on this page). */
  .voice-stage .halo { width: auto; height: auto; }
  .voice-stage .halo:nth-child(1) { inset: 16%; }
  .voice-stage .halo:nth-child(2) { inset:  8%; }
  .voice-stage .halo:nth-child(3) { inset:  0%; }
</style>
{% endblock %}

{% block content %}
<div class="voice-stage">
  <div class="orb-scene" id="orb-scene">

    <!-- Halo pulse rings -->
    <div class="halo"></div>
    <div class="halo"></div>
    <div class="halo"></div>

    <!-- SVG arc reticles (vector — scales crisply to any size) -->
    <svg class="arc-svg" viewBox="-150 -150 300 300" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="2.5" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="glow-sm" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="1.5" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <g class="arc-outer">
        <circle cx="0" cy="0" r="138" fill="none" stroke="rgba(0,212,255,0.22)" stroke-width="1"
          stroke-dasharray="180 20 60 20 40 20 80 20"/>
        <path d="M 0,-138 A 138,138 0 0,1 138,0" fill="none" stroke="rgba(0,212,255,0.55)"
          stroke-width="1.5" filter="url(#glow-sm)"/>
        <circle cx="138" cy="0" r="3.5" fill="var(--j-blue)" filter="url(#glow)"/>
      </g>

      <g class="arc-mid">
        <circle cx="0" cy="0" r="118" fill="none" stroke="rgba(0,212,255,0.18)" stroke-width="1"
          stroke-dasharray="12 10 40 10 8 10"/>
        <circle cx="0" cy="-118" r="2.5" fill="rgba(0,212,255,0.7)" filter="url(#glow-sm)"/>
      </g>

      <g class="arc-inner">
        <circle cx="0" cy="0" r="98" fill="none" stroke="rgba(0,212,255,0.12)" stroke-width="0.8"
          stroke-dasharray="3 22"/>
        <circle cx="98" cy="0" r="1.8" fill="rgba(0,212,255,0.5)"/>
      </g>

      <g class="arc-sweep">
        <g class="arc-sweep-line">
          <line x1="0" y1="0" x2="0" y2="-130" stroke="url(#sweep-grad)" stroke-width="1.5" opacity="0.6"/>
          <circle cx="0" cy="-130" r="2" fill="rgba(0,212,255,0.8)"/>
        </g>
        <defs>
          <linearGradient id="sweep-grad" x1="0" y1="1" x2="0" y2="0" gradientUnits="objectBoundingBox">
            <stop offset="0%"   stop-color="rgba(0,212,255,0)"/>
            <stop offset="100%" stop-color="rgba(0,212,255,0.7)"/>
          </linearGradient>
        </defs>
      </g>

      <g stroke="rgba(0,212,255,0.3)" stroke-width="1">
        <line x1="0" y1="-148" x2="0" y2="-138"/>
        <line x1="0" y1="138"  x2="0" y2="148"/>
        <line x1="-148" y1="0" x2="-138" y2="0"/>
        <line x1="138"  y1="0" x2="148"  y2="0"/>
      </g>
      <g stroke="rgba(0,212,255,0.15)" stroke-width="0.8">
        <line x1="95"  y1="-95" x2="100"  y2="-100"/>
        <line x1="-95" y1="-95" x2="-100" y2="-100"/>
        <line x1="95"  y1="95"  x2="100"  y2="100"/>
        <line x1="-95" y1="95"  x2="-100" y2="100"/>
      </g>
    </svg>

    <!-- Ring waveform canvas (buffer sized to the box at runtime) -->
    <canvas id="orb-canvas"></canvas>

    <!-- Core -->
    <div class="orb-core" id="orb-core">
      <div class="orb-label">J.A.R.V.I.S</div>
      <div class="orb-status" id="core-status">READY</div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
// ══════════════════════════════════════════════════════════
//  DOT SPHERE + TORUS WAVEFORM — voice-reactive 3D particle orb
//  Size-aware version: the drawing buffer is sized to the orb box and every
//  spatial constant scales by S = W/290, so the ring fills a huge /voice orb
//  crisply while staying identical to the original at the 290px reference size.
// ══════════════════════════════════════════════════════════
const ORB_STYLE = new URLSearchParams(location.search).get('style') || 'dots';
(function () {
  if (ORB_STYLE !== 'dots') return;         // an arc sphere below draws instead
  const canvas = document.getElementById('orb-canvas');
  const ctx    = canvas.getContext('2d');
  const scene  = document.getElementById('orb-scene');

  let W = 290, H = 290, cx = 145, cy = 145, S = 1;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const box = Math.max(Math.min(scene.clientWidth, scene.clientHeight), 120);
    canvas.width  = Math.round(box * dpr);
    canvas.height = Math.round(box * dpr);
    canvas.style.width  = box + 'px';
    canvas.style.height = box + 'px';
    W = canvas.width; H = canvas.height; cx = W / 2; cy = H / 2;
    S = W / 290;                 // 290 = original reference buffer
  }
  resize();
  window.addEventListener('resize', resize);

  let amplitude = 0.04, targetAmplitude = 0.04;
  let phaseT = 0;
  let _state = 'ready';

  window._setOrbState = function (s) {
    _state = s;
    targetAmplitude = s === 'speaking'  ? 1.0
                    : s === 'listening' ? 0.55
                    : s === 'thinking'  ? 0.3
                    : 0.04;
  };

  // ── 3D scene ──────────────────────────────────────────────
  // A sphere made of dots (Fibonacci lattice) whose surface ripples with the
  // voice, wrapped by a waveform ring of dots — an oscilloscope trace bent
  // around the sphere. Every dot is projected with real perspective and drawn
  // far-to-near, so the ring genuinely passes behind and in front of the
  // sphere. Depth and a top-left light drive size and brightness.
  const N_SPHERE = 2200;

  const sphereDots = [];
  const GA = Math.PI * (3 - Math.sqrt(5));            // golden angle
  for (let i = 0; i < N_SPHERE; i++) {
    const y = 1 - (i + 0.5) * 2 / N_SPHERE, rr = Math.sqrt(1 - y * y), th = i * GA;
    sphereDots.push({ x: Math.cos(th) * rr, y, z: Math.sin(th) * rr,
                      sz: 0.42 + Math.random() * 0.5, base: 0.45 + Math.random() * 0.4,
                      sparkle: Math.random() < 0.04 });
  }
  // The torus waveform (from the previous orb): particles in a tube around a
  // main ring, plus a fainter cross-tilted orbit, with layered wave strokes.
  const N_PARTICLES = 1300;
  const parts = Array.from({ length: N_PARTICLES }, (_, i) => {
    const sparkle = Math.random() < 0.07;
    return {
      ring: i % 7 === 0 ? 1 : 0,
      a:   Math.random() * Math.PI * 2,
      phi: Math.random() * Math.PI * 2,
      rr:  Math.sqrt(Math.random()),
      spd: (0.25 + Math.random() * 0.55) * (Math.random() < 0.5 ? 1 : -1),
      sz:  sparkle ? 1.6 + Math.random() * 1.1 : 0.55 + Math.random() * 0.85,
      base:sparkle ? 0.55 + Math.random() * 0.4 : 0.18 + Math.random() * 0.38,
      sparkle,
    };
  });
  const N_PATH = 320;

  function wave(angle, t) {
    return (
      Math.sin(angle * 5  + t * 1.9)  * 0.38 +
      Math.sin(angle * 9  + t * 2.7)  * 0.22 +
      Math.sin(angle * 13 + t * 1.15) * 0.14 +
      Math.sin(angle * 3  + t * 0.65) * 0.18 +
      Math.sin(angle * 19 + t * 3.4)  * 0.08
    );
  }
  function _speechEnvelope(t) {
    const raw = (
      Math.abs(Math.sin(t * 3.7)) * 0.38 +
      Math.abs(Math.sin(t * 5.1)) * 0.28 +
      Math.abs(Math.sin(t * 2.3)) * 0.20 +
      Math.abs(Math.sin(t * 7.9)) * 0.14
    );
    return Math.min(raw, 1.0);
  }
  // Smooth pseudo-noise over the unit sphere, roughly -1..1.
  function field(x, y, z, t) {
    return (
      Math.sin(x * 3.1 + t * 1.7) * Math.sin(y * 2.7 + t * 1.3 + 1.0) * 0.9 +
      Math.sin(y * 4.3 - t * 2.2 + z * 2.0) * 0.45 +
      Math.sin(z * 5.7 + t * 2.9 + x * 1.5) * 0.3
    );
  }

  // Rotate (yaw about Y, then pitch about X, then roll in the screen plane)
  // and project. Returns screen x/y, depth d (+ = away) and scale k.
  function project(x, y, z, yaw, pitch, roll, F) {
    const cy_ = Math.cos(yaw), sy_ = Math.sin(yaw);
    const x1 = x * cy_ + z * sy_, z1 = -x * sy_ + z * cy_;
    const cp = Math.cos(pitch), sp = Math.sin(pitch);
    const y2 = y * cp - z1 * sp, z2 = y * sp + z1 * cp;
    const k = F / (F + z2);
    let sx = x1 * k, sy = -y2 * k;
    if (roll) {
      const cr = Math.cos(roll), sr = Math.sin(roll);
      [sx, sy] = [sx * cr - sy * sr, sx * sr + sy * cr];
    }
    return { x: cx + sx, y: cy + sy, d: z2, k };
  }

  // Ring-local point (radius rad at angle a, height y) → screen + depth.
  function projectRing(rad, a, y, pitch, roll, F) {
    const x = rad * Math.cos(a), z = rad * Math.sin(a);
    const cp = Math.cos(pitch), sp = Math.sin(pitch);
    const h = -y * cp - z * sp;
    const d =  z * cp - y * sp;
    const k = F / (F + d);
    let sx = x * k, sy = h * k;
    if (roll) {
      const cr = Math.cos(roll), sr = Math.sin(roll);
      [sx, sy] = [sx * cr - sy * sr, sx * sr + sy * cr];
    }
    return { x: cx + sx, y: cy + sy, d, k };
  }

  const LIGHT = (() => { const v = [-0.5, 0.6, -0.62], m = Math.hypot(...v); return v.map(c => c / m); })();
  let lastTime = 0, yaw = 0, ringSpin = 0, rippleT = 0;
  const pts = [];

  function draw(ts) {
    const dt = Math.min((ts - lastTime) / 16.67, 3);
    lastTime = ts;
    const t = ts * 0.001;

    amplitude += (targetAmplitude - amplitude) * 0.055 * dt;
    phaseT    += (0.018 + amplitude * 0.052) * dt;
    yaw       += (0.0022 + amplitude * 0.004 + (_state === 'thinking' ? 0.006 : 0)) * dt;
    ringSpin  += (0.0016 + amplitude * 0.003) * dt;
    rippleT   += (0.02 + amplitude * 0.08) * dt;

    let env = amplitude;
    if (_state === 'speaking' && amplitude > 0.2) env = amplitude * (0.25 + 0.75 * _speechEnvelope(t));

    const SR = 74 * S, RING_R = 112 * S, F = 560 * S;
    const breathe = 1 + Math.sin(t * 1.4) * 0.012 + env * 0.05;
    const pitch = 0.30 + Math.sin(t * 0.27) * 0.06;
    const ringPitch = 0.36 + Math.sin(t * 0.31) * 0.05, ringRoll = -0.14;

    ctx.clearRect(0, 0, W, H);
    const [r, g, b] = _state === 'listening' ? [240, 160, 32] : [0, 212, 255];

    // Ambient bloom + an inner glow so the dot shell reads as a volume.
    const bloom = ctx.createRadialGradient(cx, cy, SR * 0.2, cx, cy, RING_R * 1.5);
    bloom.addColorStop(0,   `rgba(${r},${g},${b},${0.10 + env * 0.10})`);
    bloom.addColorStop(0.45,`rgba(${r},${g},${b},${0.03 + env * 0.05})`);
    bloom.addColorStop(1,   'transparent');
    ctx.fillStyle = bloom;
    ctx.beginPath(); ctx.arc(cx, cy, RING_R * 1.5, 0, Math.PI * 2); ctx.fill();

    pts.length = 0;
    const near = (d, R) => Math.max(0, Math.min(1, 0.5 - d / (2 * R)));

    // Sphere shell: radial displacement = slow noise + latitude ripples that
    // travel up the sphere while Jarvis talks.
    const dispAmp = SR * (0.02 + env * 0.085);
    for (const p of sphereDots) {
      const f = field(p.x, p.y, p.z, phaseT * 2.2);
      const ripple = Math.sin(p.y * 7 - rippleT * 3) * env * 0.3;
      const disp = (f * 0.7 + ripple) * dispAmp;
      const rad = SR * breathe + disp;
      const P = project(p.x * rad, p.y * rad, p.z * rad, yaw, pitch, 0, F);
      // Normal after rotation ≈ the projected direction; light it.
      const nz = P.d / rad, nx = (P.x - cx) / (rad * P.k), ny = -(P.y - cy) / (rad * P.k);
      const lit = Math.max(0, nx * LIGHT[0] + ny * LIGHT[1] + nz * LIGHT[2]);
      const n = near(P.d, SR);
      const lift = Math.max(0, disp / (dispAmp + 1));
      const a = Math.min(0.97, (p.base * (0.18 + 0.82 * n) * (0.55 + 0.45 * lit) +
                                lift * 0.35 * n + (p.sparkle ? 0.25 * n : 0)) * (0.75 + env * 0.25));
      pts.push({ x: P.x, y: P.y, d: P.d, a,
                 s: p.sz * S * P.k * (0.7 + 0.4 * n) * (1 + lift * 0.4) * (p.sparkle ? 1.4 : 1) });
    }

    // Torus waveform around the sphere.
    const BASE_R = 112 * S, TUBE_R = 15 * S;
    const rings = [
      { pitch: ringPitch + 0.14, roll: -0.10, r: BASE_R,        alpha: 1.0 },
      { pitch: 1.15 + Math.sin(t * 0.23) * 0.04, roll: 0.62, r: BASE_R * 0.9, alpha: 0.5 },
    ];
    const maxD = TUBE_R * 0.45 + env * TUBE_R * 2.4;

    function strokes(front) {
      const ring = rings[0];
      for (let layer = 2; layer >= 0; layer--) {
        const pOff = layer * 0.65, rOff = layer * 3.5 * S;
        const alp  = (0.58 - layer * 0.14) * (0.22 + amplitude * 0.78) * (front ? 1 : 0.45);
        ctx.beginPath();
        let pen = false;
        for (let i = 0; i <= N_PATH; i++) {
          const ang = (i / N_PATH) * Math.PI * 2;
          const rad = ring.r + TUBE_R * 0.65 + rOff + wave(ang, phaseT + pOff) * maxD;
          const P = projectRing(rad, ang + ringSpin, 0, ring.pitch, ring.roll, F);
          if ((P.d <= 0) === front) { pen ? ctx.lineTo(P.x, P.y) : ctx.moveTo(P.x, P.y); pen = true; }
          else pen = false;
        }
        ctx.strokeStyle = `rgba(${r},${g},${b},${alp})`;
        ctx.lineWidth   = (1.2 + env * 0.9) * S * (front ? 1.15 : 0.8);
        ctx.stroke();
      }
    }

    const ringPts = [];
    for (const p of parts) {
      p.a += p.spd * 0.001 * (1 + amplitude * 2.8) * dt;
      const ring = rings[p.ring];
      const wv   = wave(p.a, phaseT) * maxD * (p.ring ? 0.5 : 1);
      const tube = TUBE_R * p.rr * (p.ring ? 0.5 : 1);
      const rad  = ring.r + tube * Math.cos(p.phi) + wv;
      const P    = projectRing(rad, p.a + ringSpin * (p.ring ? -0.7 : 1), tube * Math.sin(p.phi) * 0.8,
                               ring.pitch, ring.roll, F);
      const dispFactor = Math.min(Math.abs(wv) / (maxD + 1), 1);
      const n = near(P.d, BASE_R);
      const a = Math.min(p.base * (0.3 + env * 0.7) + dispFactor * 0.35 +
                         (p.sparkle ? 0.1 : 0), 0.95) * (0.3 + 0.7 * n) * ring.alpha;
      ringPts.push({ x: P.x, y: P.y, front: P.d <= 0, a,
                     s: p.sz * (0.75 + env * 0.45) * S * P.k * (0.8 + 0.4 * n) });
    }
    function ringParticles(front) {
      for (const q of ringPts) {
        if (q.front !== front) continue;
        ctx.fillStyle = `rgba(${r},${g},${b},${q.a})`;
        ctx.beginPath(); ctx.arc(q.x, q.y, q.s, 0, Math.PI * 2); ctx.fill();
      }
    }

    strokes(false); ringParticles(false);       // far half of the ring
    pts.sort((u, v) => v.d - u.d);              // dot sphere, far → near
    for (const q of pts) {
      ctx.fillStyle = `rgba(${r},${g},${b},${q.a})`;
      ctx.beginPath(); ctx.arc(q.x, q.y, q.s, 0, Math.PI * 2); ctx.fill();
    }
    strokes(true); ringParticles(true);         // near half

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();

// ══════════════════════════════════════════════════════════
//  ARC SPHERE (?style=arc) — a holographic gyroscope of broken arcs.
//  ~56 partial arcs on circles tilted every which way, grouped into three
//  gimbals that turn about different axes. Additive blending makes crossings
//  glow; each arc fades from tail to head like a light streak. Cyan at rest,
//  easing to gold while Jarvis speaks; the voice spins the gimbals up,
//  breathes the rings outward and brightens them.
// ══════════════════════════════════════════════════════════
// Also the fallback for ?style=arcgl when WebGL or the three.js CDN fails.
function startArc2D(canvas) {
  const ctx    = canvas.getContext('2d');
  const scene  = document.getElementById('orb-scene');

  let W = 290, H = 290, cx = 145, cy = 145, S = 1;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const box = Math.max(Math.min(scene.clientWidth, scene.clientHeight), 120);
    canvas.width = canvas.height = Math.round(box * dpr);
    canvas.style.width = canvas.style.height = box + 'px';
    W = canvas.width; H = canvas.height; cx = W / 2; cy = H / 2; S = W / 290;
  }
  resize();
  window.addEventListener('resize', resize);

  let state = 'ready', amp = 0.05, targetAmp = 0.05;
  window._setOrbState = function (s) {
    state = s;
    targetAmp = s === 'speaking' ? 1.0 : s === 'listening' ? 0.6 : s === 'thinking' ? 0.35 : 0.05;
  };

  // ── geometry ──
  const rnd = (a, b) => a + Math.random() * (b - a);
  function unit(v) { const m = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / m, v[1] / m, v[2] / m]; }
  function cross(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }
  function randUnit() { const z = rnd(-1, 1), t = rnd(0, Math.PI * 2), r = Math.sqrt(1 - z * z);
                        return [r * Math.cos(t), z, r * Math.sin(t)]; }
  // Rodrigues rotation of v about unit axis k by angle a.
  function rot(v, k, a) {
    const c = Math.cos(a), s = Math.sin(a), d = (k[0] * v[0] + k[1] * v[1] + k[2] * v[2]) * (1 - c);
    const x = cross(k, v);
    return [v[0] * c + x[0] * s + k[0] * d, v[1] * c + x[1] * s + k[1] * d, v[2] * c + x[2] * s + k[2] * d];
  }

  const gimbals = [
    { axis: unit([0.15, 1, 0.1]),  speed: 0.0042, angle: 0 },
    { axis: unit([1, 0.25, -0.2]), speed: -0.0031, angle: 0 },
    { axis: unit([-0.4, 0.5, 1]),  speed: 0.0055, angle: 0 },
  ];

  const arcs = [];
  for (let i = 0; i < 56; i++) {          // 0-5 heroes, 50-55 thin outer halo
    const n = randUnit();
    const u = unit(cross(n, Math.abs(n[1]) < 0.9 ? [0, 1, 0] : [1, 0, 0]));
    const v = cross(n, u);
    const hero = i < 6;
    const band = Math.random();
    arcs.push({
      u, v, g: i % 3,
      r: hero ? rnd(0.92, 1.04) : i >= 50 ? rnd(1.12, 1.26) : band < 0.6 ? rnd(0.86, 1.06) : rnd(0.45, 0.85),
      start: rnd(0, Math.PI * 2),
      span: hero ? rnd(2.2, 4.6) : rnd(0.35, 2.6),
      spin: rnd(0.002, 0.009) * (Math.random() < 0.5 ? 1 : -1),
      w: hero ? rnd(2.0, 3.0) : i >= 50 ? rnd(0.5, 0.9) : rnd(0.6, 1.6),
      a: hero ? 0.9 : rnd(0.35, 0.8),
      dashed: i >= 50 || (!hero && Math.random() < 0.28),
      phase: rnd(0, Math.PI * 2),
    });
  }
  // Fine "internal structure": chords across the sphere, and surface sparks.
  const chords = Array.from({ length: 10 }, () => ({ a: randUnit(), b: randUnit(), g: Math.floor(rnd(0, 3)), al: rnd(0.08, 0.2) }));
  const sparks = Array.from({ length: 140 }, () => ({ p: randUnit(), g: Math.floor(rnd(0, 3)), r: rnd(0.7, 1.08),
                                                      tw: rnd(0, Math.PI * 2), sz: rnd(0.5, 1.4) }));

  const CYAN = [0, 212, 255], GOLD = [255, 178, 48];
  let col = CYAN.slice();
  const tilt = 0.32;
  function project(p, R, F) {
    // global tilt (pitch about X) for a slightly-from-above view
    const c = Math.cos(tilt), s = Math.sin(tilt);
    const y = p[1] * c - p[2] * s, z = p[1] * s + p[2] * c;
    const k = F / (F + z);
    return { x: cx + p[0] * R * k, y: cy - y * R * k, z };
  }
  function place(p, g) { const gb = gimbals[g]; return rot(p, gb.axis, gb.angle); }

  function speechEnv(t) {
    return Math.min(Math.abs(Math.sin(t * 3.7)) * 0.38 + Math.abs(Math.sin(t * 5.1)) * 0.28 +
                    Math.abs(Math.sin(t * 2.3)) * 0.2 + Math.abs(Math.sin(t * 7.9)) * 0.14, 1);

  let last = 0;

    const t = ts * 0.001;

    const tgt = state === 'speaking' ? GOLD : CYAN;
    for (let i = 0; i < 3; i++) col[i] += (tgt[i] - col[i]) * 0.05 * dt;
    const [r, g, b] = col.map(Math.round);
    const rgba = (a) => `rgba(${r},${g},${b},${Math.max(0, Math.min(1, a))})`;

    const spinMul = 1 + amp * 2.2 + (state === 'thinking' ? 1.6 : 0);
    for (const gb of gimbals) gb.angle += gb.speed * spinMul * dt;

    // (wide + faint for glow, then thin + bright).

        for (let k = 0; k <= STEPS; k++) {

          const p = [ (a.u[0] * Math.cos(th) + a.v[0] * Math.sin(th)) * rr,
                      (a.u[1] * Math.cos(th) + a.v[1] * Math.sin(th)) * rr,
                      (a.u[2] * Math.cos(th) + a.v[2] * Math.sin(th)) * rr ];
          pts.push(project(place(p, a.g), R, F));
        }
        const zMid = pts[STEPS >> 1].z;
        const depth = 0.45 + 0.55 * (0.5 - zMid * 0.5);            // near = brighter
        const ramp = 0.25 + 0.75 * (c + 1) / CHUNKS;                  // tail → head
        const al = a.a * ramp * depth * (0.45 + env * 0.75);
        for (const [wMul, aMul] of [[3, 0.1], [1, 1]]) {
          ctx.strokeStyle = rgba(al * aMul);
          ctx.lineWidth = a.w * S * wMul * (1 + env * 0.25);
          ctx.beginPath();
          pts.forEach((q, i) => i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y));

        ctx.beginPath(); ctx.arc(h.x, h.y, a.w * S * 0.85, 0, Math.PI * 2); ctx.fill();

      const tw = 0.5 + 0.5 * Math.sin(t * 3 + sp.tw);
      const al = (0.15 + 0.5 * tw) * (0.4 + env * 0.8) * (0.5 - P.z * 0.4);
      ctx.fillStyle = rgba(al);

}
if (ORB_STYLE === 'arc') startArc2D(document.getElementById('orb-canvas'));
// arcgl: the module below takes over; queue states until it's ready.
if (ORB_STYLE === 'arcgl') window._setOrbState = (st) => { window._pendingOrbState = st; };

// ══════════════════════════════════════════════════════════
//  VOICE STATE  (orb only — polled here, nowhere else)
// ══════════════════════════════════════════════════════════
const STATE_COLORS = {
  speaking:  'var(--j-blue)',
  listening: 'var(--j-gold)',
  thinking:  'rgba(0,180,255,0.8)',
  ready:     'rgba(0,212,255,0.5)',
};
if (ORB_STYLE.startsWith('arc')) STATE_COLORS.speaking = 'rgb(255,178,48)';   // matches the gold sphere
function setState(state, thinkingWord) {
  document.body.classList.remove('speaking', 'listening', 'thinking');
  if (['speaking','listening','thinking'].includes(state)) document.body.classList.add(state);
  const label = (state === 'thinking' && thinkingWord) ? thinkingWord.toUpperCase() : state.toUpperCase();
  const el = document.getElementById('core-status');
  if (el) { el.textContent = label; el.style.color = STATE_COLORS[state] || 'var(--j-blue)'; fitStatus(); }
  window._setOrbState(state);
}
// Thinking words run up to 17 chars ("CROSS-REFERENCING") — at room-legible size
// they overflow the core onto the ring, so shrink the label to fit when needed.
function fitStatus() {
  const el = document.getElementById('core-status');
  const core = document.getElementById('orb-core');
  if (!el || !core) return;
  el.style.fontSize = '';                       // back to the CSS (viewport) size
  const room = core.clientWidth * 0.92;
  if (el.scrollWidth > room) {
    const px = parseFloat(getComputedStyle(el).fontSize);
    el.style.fontSize = Math.max(10, px * room / el.scrollWidth) + 'px';

window.addEventListener('resize', fitStatus);
async function pollVoiceState() {
  try {
    const resp = await fetch('/api/voice-state?room=office');
    const data = await resp.json();
    setState(data.state || 'ready', data.thinking_word);
  } catch (e) { /* transient — keep last state */ }
}

setInterval(pollVoiceState, 1200);

<!-- ══════════════════════════════════════════════════════════
     ARC SPHERE, WebGL (?style=arcgl) — the same gyroscope of broken arcs,
     rendered with three.js and an UnrealBloom pass so bright lines bleed light
     like the film hologram. Fat lines (Line2) with a dim-tail → bright-head
     ramp, fog to dim the far side, additive sparks, a soft core sprite.
     The canvas renders on black and uses mix-blend-mode: screen, so black
     drops out and the bloom glows over the page (WebGL bloom can't keep a
     transparent background). Falls back to the 2D arc sphere on any failure.
     ══════════════════════════════════════════════════════════ -->
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
<script type="module">
if (ORB_STYLE === 'arcgl') {
  const canvas = document.getElementById('orb-canvas');
  const fallback = (err) => {
    console.warn('[orb] WebGL arc sphere unavailable, using 2D:', err);
    const fresh = canvas.cloneNode(false);          // a canvas that never had a GL context
    canvas.replaceWith(fresh);
    window._setOrbState = () => {};
    startArc2D(fresh);
    if (window._pendingOrbState) window._setOrbState(window._pendingOrbState);
  };
  try {
    const THREE = await import('three');
    const { Line2 }          = await import('three/addons/lines/Line2.js');
    const { LineGeometry }   = await import('three/addons/lines/LineGeometry.js');
    const { LineMaterial }   = await import('three/addons/lines/LineMaterial.js');
    const { EffectComposer } = await import('three/addons/postprocessing/EffectComposer.js');
    const { RenderPass }     = await import('three/addons/postprocessing/RenderPass.js');
    const { UnrealBloomPass }= await import('three/addons/postprocessing/UnrealBloomPass.js');
    const { OutputPass }     = await import('three/addons/postprocessing/OutputPass.js');
    start(THREE, { Line2, LineGeometry, LineMaterial, EffectComposer, RenderPass, UnrealBloomPass, OutputPass });
  } catch (e) { fallback(e); }

  function start(THREE, X) {
    const scene = document.getElementById('orb-scene');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
    renderer.setClearColor(0x000000, 1);
    canvas.style.mixBlendMode = 'screen';
    // Fade the square canvas out radially, so the bloom haze has no edges.
    canvas.style.maskImage = canvas.style.webkitMaskImage =
      'radial-gradient(circle closest-side, #000 72%, transparent 100%)';
    const coreEl = document.getElementById('orb-core');
    if (coreEl) coreEl.style.background = 'radial-gradient(circle, rgba(0,4,10,.5) 25%, transparent 70%)';
    const DPR = Math.min(window.devicePixelRatio || 1, 1.5);
    renderer.setPixelRatio(DPR);

    const world = new THREE.Scene();
    world.fog = new THREE.Fog(0x000000, 3.0, 5.4);         // far side of the sphere dims
    const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 50);
    camera.position.set(0, 1.25, 3.85);
    camera.lookAt(0, 0, 0);

    const composer = new X.EffectComposer(renderer);
    composer.addPass(new X.RenderPass(world, camera));
    const bloom = new X.UnrealBloomPass(new THREE.Vector2(512, 512), 0.8, 0.45, 0.05);
    composer.addPass(bloom);
    composer.addPass(new X.OutputPass());

    const lineMats = [], a_heads = [];
    function resize() {
      const box = Math.max(Math.min(scene.clientWidth, scene.clientHeight), 120);
      renderer.setSize(box, box, false);
      canvas.style.width = canvas.style.height = box + 'px';
      composer.setSize(box, box);
      bloom.resolution.set(box * DPR, box * DPR);
      for (const m of lineMats) m.resolution.set(box * DPR, box * DPR);
      sizeScale = box / 600;
    }
    let sizeScale = 1;

    // ── helpers ──
    const rnd = (a, b) => a + Math.random() * (b - a);
    const randUnit = () => new THREE.Vector3().randomDirection();
    function glowTexture() {
      const c = document.createElement('canvas'); c.width = c.height = 64;
      const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
      gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.3, 'rgba(255,255,255,.45)');
      gr.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(c);
    }
    const GLOW = glowTexture();
    const tint = new THREE.Color(0x00d4ff);                  // shared, eased per frame

    // ── gimbals: three groups turning about different axes ──
    const gimbals = [
      { axis: new THREE.Vector3(0.15, 1, 0.1).normalize(),  speed: 0.0042 },
      { axis: new THREE.Vector3(1, 0.25, -0.2).normalize(), speed: -0.0031 },
      { axis: new THREE.Vector3(-0.4, 0.5, 1).normalize(),  speed: 0.0055 },
    ].map(g => { g.group = new THREE.Group(); world.add(g.group); return g; });

    // ── arcs ──
    const arcs = [];
    const Z = new THREE.Vector3(0, 0, 1);
    for (let i = 0; i < 56; i++) {
      const hero = i < 6, outer = i >= 50;
      const r = hero ? rnd(0.92, 1.04) : outer ? rnd(1.12, 1.26) : Math.random() < 0.6 ? rnd(0.86, 1.06) : rnd(0.45, 0.85);
      const span = hero ? rnd(2.2, 4.6) : rnd(0.35, 2.6);
      const n = Math.max(8, Math.round(span * 22));
      const pos = [], col = [];
      for (let k = 0; k <= n; k++) {
        const th = span * k / n;
        pos.push(Math.cos(th) * r, Math.sin(th) * r, 0);
        const b = 0.12 + 0.88 * Math.pow(k / n, 1.6);       // dim tail → bright head
        col.push(b, b, b);
      }
      const geo = new X.LineGeometry(); geo.setPositions(pos); geo.setColors(col);
      const mat = new X.LineMaterial({
        color: 0xffffff, linewidth: hero ? rnd(2.6, 3.6) : outer ? rnd(0.8, 1.2) : rnd(1.0, 2.0),
        vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
        dashed: outer || (!hero && Math.random() < 0.28), dashSize: 0.07, gapSize: 0.05, fog: true,
      });
      lineMats.push(mat);
      const line = new X.Line2(geo, mat); line.computeLineDistances();
      const spinObj = new THREE.Object3D(); spinObj.add(line);
      spinObj.rotation.z = rnd(0, Math.PI * 2);
      if (hero) {                                            // bright head
        const head = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, color: 0xffffff,
          blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));
        head.position.set(Math.cos(span) * r, Math.sin(span) * r, 0);
        head.scale.setScalar(0.09);
        spinObj.add(head);
        a_heads.push(head);
      }
      const orient = new THREE.Object3D();
      orient.quaternion.setFromUnitVectors(Z, randUnit());
      orient.add(spinObj);
      gimbals[i % 3].group.add(orient);
      arcs.push({ spinObj, mat, base: hero ? 1.0 : rnd(0.45, 0.85),

    }

    // ── internal chords ──
    const chordPos = [];
    for (let i = 0; i < 12; i++) { const a = randUnit().multiplyScalar(0.98), b = randUnit().multiplyScalar(0.98);
                                   chordPos.push(a.x, a.y, a.z, b.x, b.y, b.z); }
    const chordGeo = new THREE.BufferGeometry();
    chordGeo.setAttribute('position', new THREE.Float32BufferAttribute(chordPos, 3));
    const chordMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.12,
      blending: THREE.AdditiveBlending, depthWrite: false });
    gimbals[1].group.add(new THREE.LineSegments(chordGeo, chordMat));

    // ── sparks ──
    const N_SPARK = 220, sparkPos = new Float32Array(N_SPARK * 3), sparkCol = new Float32Array(N_SPARK * 3), tw = [];
    for (let i = 0; i < N_SPARK; i++) {
      const p = randUnit().multiplyScalar(rnd(0.7, 1.1));
      sparkPos.set([p.x, p.y, p.z], i * 3); tw.push(rnd(0, Math.PI * 2));
    }
    const sparkGeo = new THREE.BufferGeometry();
    sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPos, 3));
    sparkGeo.setAttribute('color', new THREE.BufferAttribute(sparkCol, 3));
    const sparkMat = new THREE.PointsMaterial({ size: 0.035, map: GLOW, vertexColors: true, transparent: true,
      blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true });
    gimbals[2].group.add(new THREE.Points(sparkGeo, sparkMat));

    // ── core glow ──
    const core = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, transparent: true,
      blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.35 }));
    core.scale.setScalar(1.15);
    world.add(core);

    resize();
    window.addEventListener('resize', resize);

    // ── state ──
    let state = 'ready', amp = 0.05, targetAmp = 0.05;
    window._setOrbState = (s) => {
      state = s;
      targetAmp = s === 'speaking' ? 1.0 : s === 'listening' ? 0.6 : s === 'thinking' ? 0.35 : 0.05;
    };
    if (window._pendingOrbState) window._setOrbState(window._pendingOrbState);

    const CYAN = new THREE.Color(0x00d4ff), GOLD = new THREE.Color(0xffb230);
    const speechEnv = (t) => Math.min(Math.abs(Math.sin(t * 3.7)) * 0.38 + Math.abs(Math.sin(t * 5.1)) * 0.28 +
                                      Math.abs(Math.sin(t * 2.3)) * 0.2 + Math.abs(Math.sin(t * 7.9)) * 0.14, 1);
    let last = performance.now();
    function frame(now) {
      const dt = Math.min((now - last) / 16.67, 3); last = now;
      const t = now * 0.001;
      amp += (targetAmp - amp) * 0.06 * dt;
      const env = state === 'speaking' && amp > 0.2 ? amp * (0.3 + 0.7 * speechEnv(t)) : amp;
      tint.lerp(state === 'speaking' ? GOLD : CYAN, 0.05 * dt);

      const spinMul = 1 + amp * 2.2 + (state === 'thinking' ? 1.6 : 0);
      for (const g of gimbals) g.group.rotateOnWorldAxis(g.axis, g.speed * spinMul * dt);
      const swell = 1 + env * 0.06 + (state === 'listening' ? 0.04 : 0);

      const bright = 0.5 + env * 0.55;                       // >1 feeds the bloom harder
      for (const a of arcs) {
        a.spinObj.rotation.z += a.spin * spinMul * dt;
        a.spinObj.scale.setScalar(swell * (1 + env * 0.1 * Math.sin(a.phase + t * 2.4)));

      }

}
