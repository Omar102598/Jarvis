name: JarvisDesktop
options:
  bundleIdPrefix: com.jarvis
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.4"

settings:
  base:
    SWIFT_VERSION: "5.9"

targets:
  JarvisDesktop:
    type: application
    platform: macOS
    # NOTE: xcodegen has no `resources:` target key (silently ignored) —
    # resources go under `sources:` (Info.plist is excluded; it's referenced
    # by INFOPLIST_FILE and must not also be copied as a resource).
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - "Info.plist"
    entitlements:
      path: JarvisDesktop.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jarvis.desktop
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""  # Fill in your Apple Developer Team ID
        LSUIElement: YES       # Menubar-only app — no Dock icon by default
    dependencies:
      - package: JarvisShared
        product: JarvisShared

packages:
  JarvisShared:
    path: ../JarvisShared
