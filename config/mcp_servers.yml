# ==============================================================================
# JARVIS MCP Server Registry
# ==============================================================================
# Each entry defines one MCP server Jarvis connects to at startup.
# Tools from enabled servers are added to Jarvis's core tool list automatically.
#
# Transport types:
#   stdio          — spawns a local process (requires command + args)
#   streamable_http — connects to a running HTTP server (requires url;
#                     optional headers: map for auth, ${VAR} expanded from env)
#   sse            — Server-Sent Events transport (requires url)
#
# stdio servers require Node.js (npx …) or uv (uvx …) in the llm_agent
# container. The Dockerfile installs both, so npx- and uvx-based servers work
# out of the box.
#
# persistent: true — hold ONE session open for the life of the process instead
# of a fresh connection per tool call. REQUIRED for stateful servers (playwright:
# the browser must keep page state between navigate and the next step; memory:
# avoids a subprocess spawn per call).
#
# To activate a server: set enabled: true and rebuild llm_agent.
# To add a server at runtime: tell Jarvis "install MCP server <package>".
# ==============================================================================

servers:

  # ---------------------------------------------------------------------------
  # Filesystem — structured read/write within a safe directory.
  # Complements Jarvis's existing file tools with MCP-standard operations.
  # ---------------------------------------------------------------------------
  filesystem:
    enabled: false
    transport: stdio
    command: npx
    args:
      - "-y"
      - "@modelcontextprotocol/server-filesystem"
      - "/data/workspace"   # directory Jarvis is allowed to access
    description: "MCP filesystem access under /data/workspace"

  # ---------------------------------------------------------------------------
  # Fetch — clean web page fetching with Markdown conversion.
  # Better than the raw fetch_url tool for reading articles/docs.
  # NOTE: the official fetch server is a Python package (there is no
  # @modelcontextprotocol/server-fetch on npm) — it runs via uvx, which the
  # llm_agent Dockerfile installs alongside Node.
  # ---------------------------------------------------------------------------
  fetch:
    enabled: true
    transport: stdio
    command: uvx
    args:
      - "mcp-server-fetch"
    description: "MCP web fetching with Markdown conversion"

  # ---------------------------------------------------------------------------
  # GitHub — issues, PRs, repos, code search.
  # Set GITHUB_TOKEN in .env. Replaces custom github_tool.py once stable.
  # The npm server (@modelcontextprotocol/server-github) is archived upstream;
  # GitHub's maintained server is the hosted remote below (PAT via headers).
  # ---------------------------------------------------------------------------
  github:
    enabled: false
    transport: streamable_http
    url: "https://api.githubcopilot.com/mcp/"
    headers:
      Authorization: "Bearer ${GITHUB_TOKEN}"
    description: "MCP GitHub (hosted remote) — issues, PRs, code search"

  # ---------------------------------------------------------------------------
  # Playwright — browser automation via MCP (replaces the mac_browser_* tools).
  # Runs headless Chromium INSIDE the llm_agent container (fresh sessions, no
  # logins) — for signed-in sites keep using mac_chrome_* via mac_bridge.
  # The Dockerfile pre-installs @playwright/mcp + Chromium.
  # persistent: one live browser keeps page state across tool calls.
  # ---------------------------------------------------------------------------
  playwright:
    enabled: true
    persistent: true
    transport: stdio
    command: npx
    args:
      - "-y"
      - "@playwright/mcp"
      - "--browser"
      - "chromium"     # default is Google Chrome, which isn't in the container
      - "--headless"
      - "--no-sandbox"
      - "--isolated"
    description: "MCP Playwright browser automation (headless, fresh sessions)"

  # ---------------------------------------------------------------------------
  # Memory — knowledge-graph memory (entities + relations), complements Chroma
  # semantic memory. Graph persists to /data/mcp_memory.json (./data volume).
  # ---------------------------------------------------------------------------
  memory:
    enabled: true
    persistent: true
    transport: stdio
    command: npx
    args:
      - "-y"
      - "@modelcontextprotocol/server-memory"
    env:
      MEMORY_FILE_PATH: "/data/mcp_memory.json"
    description: "MCP knowledge-graph memory (entities/relations)"

  # ---------------------------------------------------------------------------
  # Google Maps — directions, distance matrix, geocoding, place search.
  # Gives Jarvis real-world travel awareness: "when should I leave for my 2pm?"
  # (distance matrix + directions with live-ish travel times), address ⇄ lat/lng
  # geocoding, and nearby place lookup.
  # Stateless — each call is independent, so NO persistent flag (no session to
  # hold open; a fresh connection per call is correct here).
  # Requires GOOGLE_MAPS_API_KEY in .env. Until that key is set the server will
  # fail to start — but mcp_loader catches per-server failures and SKIPS it
  # GRACEFULLY (playwright/memory still load), so enabling it now is harmless.
  # ---------------------------------------------------------------------------
  google_maps:
    enabled: true
    transport: stdio
    command: npx
    args:
      - "-y"
      - "@modelcontextprotocol/server-google-maps"
    env:
      GOOGLE_MAPS_API_KEY: "${GOOGLE_MAPS_API_KEY}"
    description: "MCP Google Maps — directions, distance matrix, geocoding, place search"

  # ---------------------------------------------------------------------------
  # Airbnb — listing search + details (community OpenBnB server; the most-used
  # travel MCP). No API key. Powers Miles's vacation-rental research; BOOKING
  # always happens in the user's signed-in browser, never here.
  # ---------------------------------------------------------------------------
  airbnb:
    enabled: true
    transport: stdio
    command: npx
    args:
      - "-y"
      - "@openbnb/mcp-server-airbnb"
      - "--ignore-robots-txt"
    description: "MCP Airbnb — listing search + details (Miles travel research)"

  # ---------------------------------------------------------------------------
  # Kiwi.com — OFFICIAL flight search (aggregator). Free, NO key/account —
  # hosted remote server. Powers Miles's flight leg (search + book links).
  # ---------------------------------------------------------------------------
  kiwi_flights:
    enabled: true
    transport: streamable_http
    url: "https://mcp.kiwi.com"
    description: "MCP Kiwi.com (official) — flight search, no key"

  # ---------------------------------------------------------------------------
  # Jinko — hotel search + booking (2M+ hotels). Search needs no key; booking
  # returns a PAYMENT LINK (approval-gated, never auto-charges). Powers Miles's
  # hotel leg alongside the Airbnb MCP for rentals.
  # ---------------------------------------------------------------------------
  jinko_hotels:
    enabled: true
    transport: stdio
    command: npx
    args:
      - "-y"
      - "jinko-mcp-dev@latest"
    description: "MCP Jinko — hotel search + booking (payment-link, Miles)"

  # ---------------------------------------------------------------------------
  # Expedia (OFFICIAL, ExpediaGroup) — hotels/flights/activities/car rentals
  # recommendations. uvx (Python). Requires EXPEDIA_API_KEY (Expedia Partner/
  # Rapid API — partner-gated, not instant). Skips gracefully without the key.
  # ---------------------------------------------------------------------------
  expedia:
    enabled: true
    transport: stdio
    command: uvx
    args:
      - "expedia_travel_recommendations_mcp"
      - "--protocol"
      - "stdio"
    env:
      EXPEDIA_API_KEY: "${EXPEDIA_API_KEY}"
    description: "MCP Expedia (official) — hotels/flights/activities/cars"

  # ---------------------------------------------------------------------------
  # Slack — read channels, post messages, search.
  # Requires SLACK_BOT_TOKEN and SLACK_TEAM_ID in .env.
  # ---------------------------------------------------------------------------
  slack:
    enabled: false
    transport: stdio
    command: npx
    args:
      - "-y"
      - "@modelcontextprotocol/server-slack"
    env:
      SLACK_BOT_TOKEN: "${SLACK_BOT_TOKEN}"
      SLACK_TEAM_ID: "${SLACK_TEAM_ID}"
    description: "MCP Slack — channels, messages, search"

  # ---------------------------------------------------------------------------
  # Custom SSE server — for your own MCP server running locally or on VPS.
  # Example: a private MCP server you build for Jarvis-specific tools.
  # ---------------------------------------------------------------------------
  # custom:
  #   enabled: false
  #   transport: streamable_http
  #   url: "http://localhost:9000/mcp"
  #   description: "Custom Jarvis MCP server"

  # ---------------------------------------------------------------------------
  # sequential_thinking — added by Jarvis (install_mcp_server)
  # Structured step-by-step reasoning tool for complex problem solving
  # ---------------------------------------------------------------------------
  sequential_thinking:
    enabled: true
    transport: stdio
    command: npx
    args:
      - "-y"
      - "@modelcontextprotocol/server-sequential-thinking"
    description: "Structured step-by-step reasoning tool for complex problem solving"
