# ==============================================================================
# JARVIS MCP Server Registry
# ==============================================================================
# Each entry defines one MCP server Jarvis connects to at startup.
# Tools from enabled servers are added to Jarvis's core tool list automatically.
#
# Transport types:
#   stdio          — spawns a local process (requires command + args)
#   streamable_http — connects to a running HTTP server (requires url;
#                     optional headers: map for auth, ${VAR} expanded from env)
#   sse            — Server-Sent Events transport (requires url)
#
# stdio servers require Node.js (npx …) or uv (uvx …) in the llm_agent
# container. The Dockerfile installs both, so npx- and uvx-based servers work
# out of the box.
#
# persistent: true — hold ONE session open for the life of the process instead
# of a fresh connection per tool call. REQUIRED for stateful servers (playwright:
# the browser must keep page state between navigate and the next step; memory:
# avoids a subprocess spawn per call).
#
# To activate a server: set enabled: true and rebuild llm_agent.
# To add a server at runtime: tell Jarvis "install MCP server <package>".
# ==============================================================================

servers:

  # ---------------------------------------------------------------------------
  # Filesystem — structured read/write within a safe directory.
  # Complements Jarvis's existing file tools with MCP-standard operations.
  # ---------------------------------------------------------------------------
  filesystem:
    enabled: false
    transport: stdio
    command: npx
    args:
      - "-y"
      - "@modelcontextprotocol/server-filesystem"
      - "/data/workspace"   # directory Jarvis is allowed to access
    description: "MCP filesystem access under /data/workspace"

  # ---------------------------------------------------------------------------
  # Fetch — clean web page fetching with Markdown conversion.
  # Better than the raw fetch_url tool for reading articles/docs.
  # NOTE: the official fetch server is a Python package (there is no
  # @modelcontextprotocol/server-fetch on npm) — it runs via uvx, which the
  # llm_agent Dockerfile installs alongside Node.
  # ---------------------------------------------------------------------------
  fetch:
    enabled: true
    transport: stdio
    command: uvx
    args:
      - "mcp-server-fetch"
    description: "MCP web fetching with Markdown conversion"

  # ---------------------------------------------------------------------------
  # GitHub — issues, PRs, repos, code search.
  # Set GITHUB_TOKEN in .env. Replaces custom github_tool.py once stable.
  # The npm server (@modelcontextprotocol/server-github) is archived upstream;
  # GitHub's maintained server is the hosted remote below (PAT via headers).
  # ---------------------------------------------------------------------------
  github:
    enabled: true
    transport: streamable_http
    url: "https://api.githubcopilot.com/mcp/"
    headers:
      Authorization: "Bearer ${GITHUB_TOKEN}"
    description: "MCP GitHub (hosted remote) — issues, PRs, code search"

  # ---------------------------------------------------------------------------
  # Playwright — browser automation via MCP (replaces the mac_browser_* tools).
  # Runs headless Chromium INSIDE the llm_agent container (fresh sessions, no
  # logins) — for signed-in sites keep using mac_chrome_* via mac_bridge.
  # The Dockerfile pre-installs @playwright/mcp + Chromium.
  # persistent: one live browser keeps page state across tool calls.
  # ---------------------------------------------------------------------------
  playwright:
    enabled: true
    persistent: true
    transport: stdio
    command: npx
    args:
      - "-y"
      - "@playwright/mcp"
      - "--browser"
      - "chromium"     # default is Google Chrome, which isn't in the container
      - "--headless"
      - "--no-sandbox"
      - "--isolated"
    description: "MCP Playwright browser automation (headless, fresh sessions)"

  # ---------------------------------------------------------------------------
  # Chrome (mcp-chrome) — SIGNED-IN browsing for the brain via the user's REAL
  # Chrome on the Mac (extension + native host = real fingerprint, real
  # sessions, existing tabs). Complements playwright (fresh/headless) exactly
  # like mac_chrome_* complements it today, but as first-class MCP tools.
  # Mac side (one-time): mcp-chrome-bridge installed+registered 2026-07-12;
  # Omar loads data/mcp-chrome-extension/ via chrome://extensions ("Developer
  # mode" → "Load unpacked") and clicks the extension icon → Connect (port
  # 12306). Until then this server skips gracefully at startup.
  # host.docker.internal reaches the Mac from the container (same as
  # mac_bridge). The brain acts inside the user's logged-in browser —
  # anything transactional (purchases, sends, bookings) must be confirmed
  # with the user first.
  # ---------------------------------------------------------------------------
  chrome:
    enabled: true
    transport: streamable_http
    url: "http://host.docker.internal:12306/mcp"
    description: "MCP Chrome (mcp-chrome) — the user's real signed-in browser; confirm before transactional actions"

  # ---------------------------------------------------------------------------
  # Memory — knowledge-graph memory (entities + relations), complements Chroma
  # semantic memory. Graph persists to /data/mcp_memory.json (./data volume).
  # ---------------------------------------------------------------------------
  memory:
    enabled: true
    persistent: true
    transport: stdio
    command: npx
    args:
      - "-y"
      - "@modelcontextprotocol/server-memory"
    env:
      MEMORY_FILE_PATH: "/data/mcp_memory.json"
    description: "MCP knowledge-graph memory (entities/relations)"

  # ---------------------------------------------------------------------------
  # Google Maps — directions, distance matrix, geocoding, place search.
  # Gives Jarvis real-world travel awareness: "when should I leave for my 2pm?"
  # (distance matrix + directions with live-ish travel times), address ⇄ lat/lng
  # geocoding, and nearby place lookup.
  # Stateless — each call is independent, so NO persistent flag (no session to
  # hold open; a fresh connection per call is correct here).
  # Requires GOOGLE_MAPS_API_KEY in .env. Until that key is set the server will
  # fail to start — but mcp_loader catches per-server failures and SKIPS it
  # GRACEFULLY (playwright/memory still load), so enabling it now is harmless.
  # ---------------------------------------------------------------------------
  google_maps:
    enabled: true
    transport: stdio
    command: npx
    args:
      - "-y"
      - "@modelcontextprotocol/server-google-maps"
    env:
      GOOGLE_MAPS_API_KEY: "${GOOGLE_MAPS_API_KEY}"
    description: "MCP Google Maps — directions, distance matrix, geocoding, place search"

  # ---------------------------------------------------------------------------
  # Airbnb — listing search + details (community OpenBnB server; the most-used
  # travel MCP). No API key. Powers Miles's vacation-rental research; BOOKING
  # always happens in the user's signed-in browser, never here.
  # ---------------------------------------------------------------------------
  airbnb:
    enabled: true
    transport: stdio
    command: npx
    args:
      - "-y"
      - "@openbnb/mcp-server-airbnb"
      - "--ignore-robots-txt"
    description: "MCP Airbnb — listing search + details (Miles travel research)"

  # ---------------------------------------------------------------------------
  # Kiwi.com — OFFICIAL flight search (aggregator). Free, NO key/account —
  # hosted remote server. Powers Miles's flight leg (search + book links).
  # ---------------------------------------------------------------------------
  kiwi_flights:
    enabled: true
    transport: streamable_http
    url: "https://mcp.kiwi.com"
    description: "MCP Kiwi.com (official) — flight search, no key"

  # ---------------------------------------------------------------------------
  # Southwest — fills a gap no aggregator can. Southwest does not distribute
  # fares to OTAs/GDS, so Kiwi will NEVER show it; that is a deliberate
  # Southwest policy, not a Kiwi failure. This is browser automation over
  # southwest.com (Playwright), so treat it as best-effort: if the site changes
  # or Chromium is missing it loads 0 tools and Miles falls back to Kiwi.
  #
  # SEARCH ONLY, deliberately. The server also ships checkout, book_with_points,
  # change_flight and cancel_flight — real money on a real account. Our agreed
  # travel model is assisted booking: Jarvis files the itinerary and links, you
  # pay in your own browser. allow_tools enforces that at load time, so the
  # booking tools never enter the graph rather than relying on the model to
  # decline them.
  #
  # search_flights/get_fares need NO credentials, which is why this is safe to
  # enable as-is. Adding SW_USERNAME/SW_PASSWORD would unlock the account tools
  # (get_rapid_rewards, check_in) — a separate, deliberate decision.
  # ---------------------------------------------------------------------------
  southwest_flights:
    enabled: true
    transport: stdio
    command: npx
    args:
      - "-y"
      - "@striderlabs/mcp-southwest"
    allow_tools:
      - search_flights
      - get_fares
      - get_flight_details
    description: "Southwest fares (search only) — the one airline Kiwi cannot see"

  # ---------------------------------------------------------------------------
  # American — evaluated and NOT enabled, on purpose.
  #
  # Two reasons, either sufficient:
  #   1. Its search requires an authenticated session, and the `login` tool
  #      opens an INTERACTIVE aa.com browser window. There is no one to click
  #      it on a headless VM.
  #   2. Unlike Southwest, American does distribute through aggregators, so
  #      Kiwi already returns AA fares. It buys us nothing Kiwi lacks.
  #
  # If AA-specific data is ever wanted (AAdvantage balance, upgrade status),
  # it needs AA_USERNAME/AA_PASSWORD plus a way to complete the login — decide
  # that deliberately, and keep the allow_tools list below.
  # ---------------------------------------------------------------------------
  american_flights:
    enabled: false
    transport: stdio
    command: npx
    args:
      - "-y"
      - "@striderlabs/mcp-american"
    allow_tools:
      - search_flights
      - get_flight_details
      - get_aadvantage
    description: "American Airlines (disabled — search needs interactive login)"

  # ---------------------------------------------------------------------------
  # Jinko — hotel search + booking (2M+ hotels). Search needs no key; booking
  # returns a PAYMENT LINK (approval-gated, never auto-charges). Powers Miles's
  # hotel leg alongside the Airbnb MCP for rentals.
  # ---------------------------------------------------------------------------
  jinko_hotels:
    enabled: true
    transport: stdio
    command: npx
    args:
      - "-y"
      # jinko-mcp-dev@latest (0.0.22) failed to load; try the non-dev package.
      # If this also fails it skips gracefully (0 tools) — Airbnb + scrape_page
      # cover lodging either way.
      - "jinko-mcp@latest"
    description: "MCP Jinko — hotel search + booking (payment-link, Miles)"

  # ---------------------------------------------------------------------------
  # Expedia (OFFICIAL, ExpediaGroup) — hotels/flights/activities/car rentals
  # recommendations. uvx (Python). Requires EXPEDIA_API_KEY (Expedia Partner/
  # Rapid API — partner-gated, not instant). Skips gracefully without the key.
  # ---------------------------------------------------------------------------
  # DISABLED 2026-07-14: the upstream package pins an old fastmcp that a current
  # pydantic rejects ("cannot specify both default and default_factory") → crashes
  # on load; AND it needs a partner-gated EXPEDIA_API_KEY we don't have. Zero value,
  # only added startup errors + delay. Kiwi (flights) + Airbnb (rentals) +
  # scrape_page (any hotel site) cover travel. Re-enable if the package is fixed
  # AND a partner key is obtained.
  expedia:
    enabled: false
    transport: stdio
    command: uvx
    args:
      - "expedia_travel_recommendations_mcp"
      - "--protocol"
      - "stdio"
    env:
      EXPEDIA_API_KEY: "${EXPEDIA_API_KEY}"
    description: "MCP Expedia (official) — hotels/flights/activities/cars [disabled]"

  # ---------------------------------------------------------------------------
  # Home Assistant (OFFICIAL core integration) — ALL Assist-exposed entities
  # (Govee lamps, future PetKit, anything added later) as MCP tools, no
  # per-endpoint maintenance in tools/smart_home.py. The `mcp_server`
  # integration was enabled via HA's config-flow API 2026-07-12.
  # Complements (does not yet replace) the custom smart_home tools.
  # ---------------------------------------------------------------------------
  home_assistant:
    enabled: true
    transport: sse
    url: "${HA_URL}/mcp_server/sse"
    headers:
      Authorization: "Bearer ${HA_TOKEN}"
    description: "MCP Home Assistant (official) — control/query all Assist-exposed entities"

  # ---------------------------------------------------------------------------
  # Gmail (OFFICIAL Google-hosted MCP) — real inbox actions for Hermes and the
  # brain: search, read, archive, label, drafts (scope gmail.modify; SENDING
  # stays on the existing SMTP tool). OAuth against accounts.google.com — NO
  # dynamic registration, so a static OAuth client (Desktop-app type, which
  # gets refresh tokens by default) is REQUIRED:
  #   one-time: scripts/authorize_google_mcps.sh <client_id> <client_secret>
  # Tokens + client info land in /data/mcp_auth (same bridge as uber_eats).
  # Skips gracefully until authorized.
  # ---------------------------------------------------------------------------
  gmail:
    enabled: true
    transport: stdio
    command: npx
    args:
      - "-y"
      - "mcp-remote@latest"
      - "https://gmailmcp.googleapis.com/mcp/v1"
      - "--static-oauth-client-info"
      - "@/data/mcp_auth/google_oauth_client.json"
      - "--static-oauth-client-metadata"
      - '{"scope":"https://www.googleapis.com/auth/gmail.modify"}'
    env:
      MCP_REMOTE_CONFIG_DIR: "/data/mcp_auth"
    description: "MCP Gmail (official hosted) — search/read/label/archive/drafts (OAuth via mcp-remote)"

  # ---------------------------------------------------------------------------
  # Google Calendar (OFFICIAL Google-hosted MCP) — WRITE access at last (today
  # Jarvis only reads next-event pushes from the iPhone via EventKit): create/
  # move/delete events, list calendars, free-time. Same OAuth client + one-time
  # script as gmail. Skips gracefully until authorized.
  # ---------------------------------------------------------------------------
  google_calendar:
    enabled: true
    transport: stdio
    command: npx
    args:
      - "-y"
      - "mcp-remote@latest"
      - "https://calendarmcp.googleapis.com/mcp/v1"
      - "--static-oauth-client-info"
      - "@/data/mcp_auth/google_oauth_client.json"
      - "--static-oauth-client-metadata"
      - '{"scope":"https://www.googleapis.com/auth/calendar"}'
    env:
      MCP_REMOTE_CONFIG_DIR: "/data/mcp_auth"
    description: "MCP Google Calendar (official hosted) — full event read/write (OAuth via mcp-remote)"

  # Google Drive / People — same pattern (drivemcp.googleapis.com/mcp/v1,
  # people.googleapis.com/mcp/v1); OFF to avoid tool bloat until needed.

  # ---------------------------------------------------------------------------
  # Package tracking (17TRACK) — universal carrier tracking (2900+ carriers,
  # free tier 100 trackings/mo). Closes the loop: Hermes finds tracking numbers
  # in email → this follows the shipment → Sentry watches the porch.
  # Requires API_TOKEN_17TRACK in .env (17track.net → Settings → API key);
  # skips gracefully without it.
  # ---------------------------------------------------------------------------
  package_tracking:
    enabled: true
    transport: stdio
    command: npx
    args:
      - "-y"
      - "mcp-server-17track"
    env:
      API_TOKEN_17TRACK: "${API_TOKEN_17TRACK}"
    description: "MCP 17TRACK — package tracking across 2900+ carriers"

  # ---------------------------------------------------------------------------
  # Resy — restaurant search + REAL booking on the user's own Resy account
  # (community server; email/password auth, auto token refresh; fetchproxy
  # browser bridge disabled — creds path works headless). Personal use of
  # YOUR OWN account only; Resy ToS frowns on automation — same category as
  # the ClassPass/Amazon Fresh automation. Booking is approval-gated: Jarvis
  # must confirm with the user before resy_book/resy_cancel.
  # Needs RESY_EMAIL + RESY_PASSWORD in .env (compose passthrough wired).
  # ---------------------------------------------------------------------------
  resy:
    enabled: true
    transport: stdio
    command: npx
    args:
      - "-y"
      - "resy-mcp"
    env:
      RESY_EMAIL: "${RESY_EMAIL}"
      RESY_PASSWORD: "${RESY_PASSWORD}"
      RESY_DISABLE_FETCHPROXY: "1"
    description: "MCP Resy — restaurant search + booking on the user's account (confirm before booking)"

  # ---------------------------------------------------------------------------
  # OpenTable — search works keyless, but booking rides a signed-in browser
  # via the fetchproxy EXTENSION on the Mac (server listens on 127.0.0.1:37149
  # for the extension's WebSocket) — that port/plumbing doesn't reach into
  # this container without extra compose wiring. OFF until wanted; OpenTable
  # booking links can also come from the resy/maps/playwright path.
  # ---------------------------------------------------------------------------
  opentable:
    enabled: false
    transport: stdio
    command: npx
    args:
      - "-y"
      - "opentable-mcp"
    description: "MCP OpenTable — search + booking links (needs fetchproxy browser bridge)"

  # ---------------------------------------------------------------------------
  # Uber Eats (OFFICIAL) — restaurant/dish search, menus, cart + order planning
  # against YOUR Uber Eats account. The hosted server uses interactive OAuth,
  # which a headless container can't do — so we bridge through mcp-remote,
  # which caches OAuth tokens in MCP_REMOTE_CONFIG_DIR (/data/mcp_auth, the
  # ./data volume). ONE-TIME SETUP on the Mac: scripts/authorize_food_mcps.sh
  # (opens a browser to sign in), then restart llm_agent. Until tokens exist
  # the server fails to start and mcp_loader SKIPS it gracefully.
  # Checkout/payment is a handoff into the user's own account — Jarvis must
  # always confirm with the user before placing any order.
  # ---------------------------------------------------------------------------
  uber_eats:
    enabled: true
    transport: stdio
    command: npx
    args:
      - "-y"
      - "mcp-remote@latest"
      - "https://mcp.ubereats.com/eats-claude/mcp"
    env:
      MCP_REMOTE_CONFIG_DIR: "/data/mcp_auth"
    description: "MCP Uber Eats (official) — restaurant search, menus, order planning (OAuth via mcp-remote)"

  # ---------------------------------------------------------------------------
  # DoorDash (OFFICIAL, consumer) — restaurant discovery, menu/price compare,
  # order planning against YOUR DoorDash account. Same mcp-remote OAuth bridge
  # + shared /data/mcp_auth token cache as uber_eats; authorized by the same
  # scripts/authorize_food_mcps.sh one-time step. Skips gracefully w/o tokens.
  # Same rule: Jarvis must confirm with the user before placing any order.
  # ---------------------------------------------------------------------------
  doordash:
    enabled: true
    transport: stdio
    command: npx
    args:
      - "-y"
      - "mcp-remote@latest"
      - "https://openapi.doordash.com/mcp/consumer"
    env:
      MCP_REMOTE_CONFIG_DIR: "/data/mcp_auth"
    description: "MCP DoorDash (official) — restaurant discovery, menus, order planning (OAuth via mcp-remote)"

  # ---------------------------------------------------------------------------
  # Slack — read channels, post messages, search.
  # Requires SLACK_BOT_TOKEN and SLACK_TEAM_ID in .env.
  # ---------------------------------------------------------------------------
  slack:
    enabled: false
    transport: stdio
    command: npx
    args:
      - "-y"
      - "@modelcontextprotocol/server-slack"
    env:
      SLACK_BOT_TOKEN: "${SLACK_BOT_TOKEN}"
      SLACK_TEAM_ID: "${SLACK_TEAM_ID}"
    description: "MCP Slack — channels, messages, search"

  # ---------------------------------------------------------------------------
  # Custom SSE server — for your own MCP server running locally or on VPS.
  # Example: a private MCP server you build for Jarvis-specific tools.
  # ---------------------------------------------------------------------------
  # custom:
  #   enabled: false
  #   transport: streamable_http
  #   url: "http://localhost:9000/mcp"
  #   description: "Custom Jarvis MCP server"

  # ---------------------------------------------------------------------------
  # sequential_thinking — added by Jarvis (install_mcp_server)
  # Structured step-by-step reasoning tool for complex problem solving
  # ---------------------------------------------------------------------------
  sequential_thinking:
    enabled: true
    transport: stdio
    command: npx
    args:
      - "-y"
      - "@modelcontextprotocol/server-sequential-thinking"
    description: "Structured step-by-step reasoning tool for complex problem solving"
