listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
log_dest stdout

# Requests carry base64 images to the brain over this bus. The default packet
# ceiling rejected anything much past a small photo — the broker logged
# "disconnected: oversize packet", dropped the publisher, and the gateway then
# waited out its 45s timeout for a reply that could never arrive. That surfaced
# as a 504 on every real phone photo while small test images passed.
#
# Clients downscale before sending; this is the ceiling for anything that does
# not (glasses, older app builds), so the failure mode is a slow request rather
# than a dropped connection.
message_size_limit 26214400

# For production, replace "allow_anonymous true" with:
# password_file /mosquitto/config/passwd
# And create passwd with: mosquitto_passwd -c /mosquitto/config/passwd jarvis
