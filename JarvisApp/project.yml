name: JarvisApp
options:
  bundleIdPrefix: com.jarvis
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  JarvisApp:
    type: application
    platform: iOS
    # NOTE: xcodegen has no `resources:` target key — it's silently IGNORED.
    # Resource files belong under `sources:`; xcodegen assigns .xcassets to the
    # resources build phase automatically. A stray `resources:` key here once
    # shipped a build with no app icon / no Assets.car.
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
    # Properties MUST live here: xcodegen rewrites the .entitlements file from
    # this block, and a bare `path:` emptied it -- silently dropping HealthKit.
    entitlements:
      path: JarvisApp.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
    # Generate the shared scheme too; regenerating used to delete the
    # hand-made one and leave xcodebuild with "no schemes".
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omarsalazar.jarvis
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "FCTJWGB3C4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: meta-wearables-dat-ios
        product: MWDATCore
      - package: meta-wearables-dat-ios
        product: MWDATCamera
      - package: meta-wearables-dat-ios
        product: MWDATDisplay
      # Used by Glasses/GlassesMockController.swift. Was added to the pbxproj by
      # hand and missing here, so every `xcodegen generate` silently dropped it.
      - package: meta-wearables-dat-ios
        product: MWDATMockDevice

packages:
  meta-wearables-dat-ios:
    url: https://github.com/facebook/meta-wearables-dat-ios
    minorVersion: "0.7.0"
