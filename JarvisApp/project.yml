name: JarvisApp
options:
  bundleIdPrefix: com.jarvis
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  JarvisApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
    resources:
      - path: Resources/Assets.xcassets
    entitlements:
      path: JarvisApp.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omarsalazar.jarvis
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "9A2248P7R6"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: meta-wearables-dat-ios
        product: MWDATCore
      - package: meta-wearables-dat-ios
        product: MWDATCamera
      - package: meta-wearables-dat-ios
        product: MWDATDisplay

packages:
  meta-wearables-dat-ios:
    url: https://github.com/facebook/meta-wearables-dat-ios
    minorVersion: "0.7.0"
